name: Tauri build

# Builds the desktop app (src-tauri/) for Mac, Linux, and Windows, and
# publishes ONE canonical installer per platform to a real, versioned
# GitHub Release per push, so wigwag.work's "Get started" cards can keep
# linking to a stable URL (tracker #168/233a071d; follow-up requested on
# #172/2fda589c -- "make the app links link to the built artefacts")
# while still leaving a real history of past releases behind (tracker
# #205 follow-up -- "versioned releases ftw").
#
# macOS leg is now code-signed and notarized (tracker #180) -- real
# Developer ID Application cert + App Store Connect API key, both
# supplied as repo secrets (never committed, never touch this workflow's
# own source). Windows still has no signing cert lined up, so it may
# still trigger a SmartScreen warning until that's its own follow-up.
#
# Versioning (tracker #205, f656ffae): this project has no manual
# version-bump/tagging step, and tauri.conf.json's committed version
# stays "0.1.0" forever on purpose -- bumping it for every ordinary push
# would just be busywork with no real meaning attached to the number.
# Auto-update support needed a REAL, ever-increasing version per build
# regardless (the updater only prompts when the manifest's version is
# semver-greater than the installed one). The "Bump the build's own
# version" step below patches src-tauri/tauri.conf.json's version to
# "0.1.<github.run_number>" directly, in the runner's own checkout, right
# before the real build -- NOT tauri-action's own `appVersion` input,
# which looks like it should do exactly this but doesn't for an existing
# project like this one (see that step's own comment for the full story;
# confirmed live, the hard way, by Tom's installed app reporting itself
# as 0.1.0 forever regardless of how many times he "updated"). That same
# number is reused as this release's own tag/name below, which is what
# makes real per-version releases possible without reintroducing a
# manual bump step: the version already exists by the time the release
# job runs, it just didn't used to go anywhere visible. `make_latest:
# true` on every new release keeps
# github.com/.../releases/latest/download/<fixed-name> resolving to
# the newest one regardless of its own tag name, so nothing downstream
# (this file's own asset-naming scheme below, tauri.conf.json's updater
# endpoint, wigwag.work's download links) needed to change for this.
#
# Each build is also signed with a dedicated updater keypair (separate
# from the Apple code-signing cert -- public half lives in
# tauri.conf.json's plugins.updater.pubkey, private half in the
# TAURI_SIGNING_PRIVATE_KEY secret below) and the `release` job hand-
# builds latest.json (the static manifest format the updater polls) from
# each platform's .sig file, since this workflow's `build` job never
# lets tauri-action manage the GitHub release itself (that stays the
# `release` job's job, same as the canonical installers). KNOWN GAP:
# only darwin-aarch64 is published (macos-latest runners are Apple
# Silicon) -- an Intel Mac won't be offered this update at all, same as
# it wouldn't be able to run the .dmg this workflow already builds today.
# Not a regression, just not yet solved.
#
# Why renamed, fixed filenames (Wigwag-macOS.dmg / Wigwag-Windows.msi /
# Wigwag-Linux.AppImage) rather than linking the bundler's own output
# filenames: those embed the version number (Wigwag_0.1.0_aarch64.dmg
# etc.), which would silently break index.html's download links the next
# time the version changes. A fixed name per platform means
# github.com/.../releases/latest/download/<fixed-name> stays correct
# forever, independent of versioning.
#
# One installer per platform, not every format targets:"all" produces:
# macOS only ever emits one install format (.dmg). Windows emits both
# .msi and an NSIS .exe -- .msi picked as the more standard/enterprise-
# friendly format. Linux emits .AppImage/.deb/.rpm -- .AppImage picked
# since it runs on any distro with no package manager involved, closest
# to "no install step" a desktop binary can get. The other formats are
# still built and still available as this workflow's own per-OS build
# artifacts (Actions tab) -- just not linked from the site's single
# per-platform chip.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # updater_asset_glob is only set when the updater's own payload is
          # a DIFFERENT file from the canonical installer -- macOS's updater
          # bundle is a .app.tar.gz, not the .dmg. Linux/Windows reuse their
          # already-canonical installer as the updater payload directly, so
          # updater_asset_name just equals asset_name for those two.
          - platform: macos-latest
            asset_glob: bundle/dmg/*.dmg
            asset_name: Wigwag-macOS.dmg
            updater_asset_glob: "*.app.tar.gz"
            updater_asset_name: Wigwag-macOS.app.tar.gz
          - platform: ubuntu-latest
            asset_glob: bundle/appimage/*.AppImage
            asset_name: Wigwag-Linux.AppImage
            updater_asset_glob: ""
            updater_asset_name: Wigwag-Linux.AppImage
          - platform: windows-latest
            asset_glob: bundle/msi/*.msi
            asset_name: Wigwag-Windows.msi
            updater_asset_glob: ""
            updater_asset_name: Wigwag-Windows.msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm ci

      - name: Bump the build's own version (tracker #205 correction)
        shell: bash
        run: |
          set -e
          # tauri-action's own `appVersion` input turned out to be a no-op
          # for a project like this one: its build.ts only calls
          # initProject (the ONE place appVersion actually gets applied,
          # in init-project.ts) when no src-tauri/ directory exists yet --
          # i.e. only for a project tauri-action scaffolds itself from
          # scratch. This repo already has a real src-tauri/, so that path
          # never ran, appVersion was silently ignored, and every build
          # kept shipping the committed "0.1.0" -- confirmed live: Tom's
          # installed app reported itself as 0.1.0 no matter how many
          # "updates" he applied, while the hand-built latest.json kept
          # advancing independently. Patching tauri.conf.json directly,
          # here, before the real build runs, is what actually works --
          # this is the normal way Tauri resolves its own version, with
          # no dependency on tauri-action's init-only behavior.
          version="0.1.${{ github.run_number }}"
          jq --arg v "$version" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json.tmp
          mv /tmp/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload bundles (all formats, per-OS build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: wigwag-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: error

      - name: Rename the canonical installer for the public download link
        shell: bash
        run: |
          set -e
          mkdir -p dist-release
          src=$(ls src-tauri/target/release/${{ matrix.asset_glob }})
          cp "$src" "dist-release/${{ matrix.asset_name }}"

      - name: Collect the updater artifact + signature (tracker #205)
        shell: bash
        run: |
          set -e
          mkdir -p dist-release
          # Tauri always places a bundle's .sig right next to it with the
          # exact same name + ".sig" -- derive the sig path from whichever
          # source file we already resolved, rather than matching by name
          # a second time (the renamed dist-release/ filename never
          # appears in the original bundler output path, so grepping for
          # it there would never match).
          if [ -n "${{ matrix.updater_asset_glob }}" ]; then
            updater_src=$(find src-tauri/target/release/bundle -name "${{ matrix.updater_asset_glob }}" | head -n1)
          else
            updater_src=$(ls src-tauri/target/release/${{ matrix.asset_glob }})
          fi
          cp "$updater_src" "dist-release/${{ matrix.updater_asset_name }}"
          cp "$updater_src.sig" "dist-release/${{ matrix.updater_asset_name }}.sig"

      - name: Upload canonical installer + updater artifact (feeds the release job)
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the canonical installer from each platform leg
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          path: dist-release
          merge-multiple: true

      - name: Build the updater manifest (latest.json) from each platform's .sig (tracker #205)
        shell: bash
        run: |
          set -e
          version="0.1.${{ github.run_number }}"
          # Pinned to THIS release's own tag, deliberately NOT
          # /latest/download/ -- that resolves to whatever's CURRENTLY
          # flagged latest at DOWNLOAD time, not whenever this manifest
          # was fetched. With pushes landing as often as they do, a
          # newer release can become "latest" in the gap between an
          # already-running app fetching this exact manifest and the
          # user actually clicking "Update & Restart" -- the signature
          # above was computed for THIS build's own artifact, so
          # resolving to a *different*, newer one at download time is
          # exactly what "signature verification failed" means. Pinning
          # to this release's own immutable tag keeps every manifest
          # and its signatures permanently self-consistent, no matter
          # how many newer releases land afterward.
          base_url="https://github.com/${{ github.repository }}/releases/download/desktop-v$version"
          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg darwin_sig "$(cat dist-release/Wigwag-macOS.app.tar.gz.sig)" \
            --arg darwin_url "$base_url/Wigwag-macOS.app.tar.gz" \
            --arg linux_sig "$(cat dist-release/Wigwag-Linux.AppImage.sig)" \
            --arg linux_url "$base_url/Wigwag-Linux.AppImage" \
            --arg windows_sig "$(cat dist-release/Wigwag-Windows.msi.sig)" \
            --arg windows_url "$base_url/Wigwag-Windows.msi" \
            '{
              version: $version,
              notes: "Automatic build from the latest main branch commit.",
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $darwin_sig, url: $darwin_url },
                "linux-x86_64": { signature: $linux_sig, url: $linux_url },
                "windows-x86_64": { signature: $windows_sig, url: $windows_url }
              }
            }' > dist-release/latest.json
          # Shared with the publish step below -- this version is now
          # the release's own tag, not just a number buried inside
          # latest.json (tracker #205 follow-up: Tom wanted a real,
          # browsable release history, not one release silently
          # overwritten on every push).
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish a real, versioned release for this build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ env.APP_VERSION }}
          name: Desktop app v${{ env.APP_VERSION }}
          body: >
            Automatically built from the latest main branch commit at the
            time -- not a hand-picked, QA'd release, just whatever main
            looked like on this push. Also shown in the app's own footer,
            next to "Format", and (if you're updating from an older
            build) in the update banner. macOS is code-signed and
            notarized (tracker #180); Windows has no signing cert yet and
            may still trigger a SmartScreen warning.
          make_latest: true
          files: dist-release/*
