<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milestone Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="toolbar">
  <div class="toolbar-title">
    <h1 id="docTitle">No tracker loaded</h1>
    <span id="docMeta" class="muted"></span>
  </div>
  <div class="toolbar-actions">
    <label class="actor-field">
      Acting as
      <input id="actorInput" type="text" placeholder="you" size="10">
    </label>
    <button id="btnNew">New tracker</button>
    <button id="btnOpen">Open file&hellip;</button>
    <button id="btnMerge" disabled>Import &amp; merge&hellip;</button>
    <div class="dropdown">
      <button id="btnExport" disabled>Export &#9662;</button>
      <div class="dropdown-menu" id="exportMenu">
        <button id="btnExportFull">Full history</button>
        <button id="btnExportSquashed">Squashed</button>
      </div>
    </div>
    <input type="file" id="fileOpen" accept=".jsonl,.txt" hidden>
    <input type="file" id="fileMerge" accept=".jsonl,.txt" hidden>
  </div>
</header>

<main id="app">
  <div id="dropHint" class="drop-hint">Drop a <code>.jsonl</code> tracker file anywhere, use "Open file&hellip;", or just start typing an item below.</div>
  <input type="text" id="filterInput" class="filter-input" placeholder="Filter by keyword">
  <div class="board">
    <table class="issue-table">
      <thead><tr id="tableHead"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="add-item-row">
      <span class="add-item-icon">+</span>
      <input type="text" id="addItemInput" placeholder="Add item">
    </div>
  </div>
</main>

<div id="panelOverlay" class="panel-overlay" hidden></div>
<aside id="detailPanel" class="side-panel" hidden>
  <div class="side-panel-header">
    <span id="panelTitle"></span>
    <div class="side-panel-header-actions">
      <button id="btnDeleteIssue" class="text-btn danger">Delete</button>
      <button id="btnClosePanel" class="icon-btn">&times;</button>
    </div>
  </div>
  <div id="panelBody" class="side-panel-body"></div>
</aside>

<div id="conflictModal" class="modal-overlay" hidden>
  <div class="modal">
    <h2>Resolve merge conflicts</h2>
    <p class="muted">These fields were changed on both sides since the copies diverged. Pick which value wins, or write a new one.</p>
    <div id="conflictList"></div>
    <div class="modal-actions">
      <button id="btnCancelMerge">Cancel merge</button>
      <button id="btnApplyMerge" class="primary">Apply merge</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
