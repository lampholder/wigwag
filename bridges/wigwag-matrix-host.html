<html>
<head>
<meta charset="utf-8">
<title>wigwag — Matrix</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Cpath d='M0 0h44v44H0z' fill='%23EF4755'/%3E%3Cpath d='M14 14h16v16H14z' fill='%23fff'/%3E%3C/svg%3E">
<script>
// Live-reported (Tom): in a real Element widget embed, the plain
// "wigwag — connect to a Matrix room" form/copy below was visible
// (unstyled, title + subtitle) for the whole real connect-handshake
// duration before the real app ever appears -- widget mode never has
// anything to prompt for (room/user/access are all implied by being
// embedded), so that form should never paint at all. document.write
// here (synchronous, during <head> parsing, before <body> exists yet)
// blocks it before the browser's very first paint -- waiting for the
// main script at the bottom of <body> to hide it would already be too
// late. Mirrors the SAME widgetId check getWidgetContext() does later;
// duplicated here deliberately since this has to run before that
// function (or anything else in the main script) exists.
if (new URLSearchParams(location.search).get('widgetId')) {
  document.write('<style id="__wigwag_prehide_setup">#setup{display:none!important}</style>');
}
</script>
<!--
  wigwag-matrix-host.html -- a separate, non-bundled container that lets
  wigwag.html read/write its data through a Matrix room instead of (or
  alongside) localStorage+GitHub. See
  /home/dev/.claude/plans/encapsulated-waddling-gizmo.md ("Room Scoped
  Widget Mode") and tracker f6b39bf0 for the full design; short version:

  - Room Scoped Widget Mode's whole point (per Tom, tracker f6b39bf0/#153)
    is that decrypted room content never sits in a browser storage this
    client controls, outside the room's own protection lifecycle. An
    earlier version of this file relied on wigwag.html and this page
    sharing the SAME real browser localStorage (same-origin parent/iframe
    pairs share it natively) -- which meant every project this browser
    ever bridged sat in real, persistent, un-namespaced local storage.
    That's fixed now: wigwag.html holds an in-memory-only shim instead of
    ever touching real localStorage for content (see its own
    createRoomModeStorageShim), and this file does the same on its own
    side (see the `localStorage` shim right below) -- nothing durable on
    either end, ever. The two sides now talk over a small `postMessage`
    protocol instead of shared storage: the iframe sends `wigwag:hello`
    once at boot; this page answers `wigwag:hello-ack` with capabilities
    and a full snapshot of the three content keys
    (docKey(projectId)/PROJECTS_KEY/IDENTITIES_KEY); after that, a
    `wigwag:local-write` from the iframe is a local edit to push to
    Matrix, and a `wigwag:storage-changed` from this page is a remote (or
    another-tab) change to apply -- wigwag.html's own existing
    `_onStorageEvent` handles the latter completely unchanged, since the
    shim dispatches a real `StorageEvent` shaped exactly like the native
    cross-tab one it already knew how to handle.
  - This IS a small, deliberate addition to wigwag.html (the handshake
    protocol) -- it stays Matrix-agnostic (no Matrix-specific code, just
    "does a parent frame answer this handshake"), but the "wigwag.html
    doesn't need to know Matrix exists" framing from the original v1 design
    no longer means "wigwag.html has zero code for this at all."
  - Same-origin is no longer required for hosting this alongside
    wigwag.html -- `postMessage` works cross-origin. (The one exception is
    the widget-embedded transport's own separate protocol, which is
    cross-origin by nature already -- Element and the widget rarely share
    an origin.)
  - This file is NOT part of the bundled-artifact workflow docs/EDITING.md
    describes, and is NOT required to be offline-capable (it inherently
    needs network access to reach Matrix) -- so unlike wigwag.html it's
    free to load wigwag-core.js with a plain <script src>.

  Two transports, one shared bridge (createMatrixBridge below), NeoBoard-
  style: STANDALONE (Phase 2) talks to a homeserver directly with a
  personal access token, pasted into the form below. WIDGET (Phase 3)
  talks through the real Matrix Widget API postMessage protocol when
  embedded in a client like Element (`widgetId` present in
  location.search) -- no form at all in that mode: the room, the viewing
  user, and access are all already implied by being embedded, the same
  way Element auto-substitutes $matrix_room_id/$matrix_user_id/etc. into
  a widget's own URL before ever loading it.

  The widget-side protocol here is HAND-ROLLED, not the real
  @matrix-widget-toolkit/api package -- a deliberate choice (see the plan
  doc's own "open decision" on this): this environment can't verify a
  CDN-loaded library actually works without a real Element session to
  test against, whereas a small, self-contained implementation can be
  fully exercised by a fake-widget-host test page I control on both
  ends. It targets the documented MSC2762 message shapes as closely as
  I can without live verification -- flagged honestly in the plan as
  needing a real Element smoke test before being trusted, not something
  this file's own test suite can certify by itself.
-->
<script src="../wigwag-core.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; margin: 0; height: 100vh; overflow: hidden; }
  #setup { max-width: 480px; margin: 60px auto; padding: 0 20px; }
  #setup h1 { font-size: 18px; margin-bottom: 4px; }
  #setup .sub { font-size: 13px; color: #6b7280; margin-bottom: 20px; line-height: 1.5; }
  #setup label { display: block; font-size: 12.5px; font-weight: 600; margin: 14px 0 4px; }
  #setup input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; font-family: inherit; }
  #setup button { margin-top: 18px; padding: 9px 16px; border: none; border-radius: 6px; background: #EF4755; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
  #setup button:disabled { opacity: 0.5; cursor: default; }
  /* Widget mode has nothing to prompt for (room/user/access are already
     implied by being embedded) but must still show #status -- it's a
     child of #setup, so hiding the whole div would silently swallow every
     connecting/error message a widget-mode user could otherwise see. */
  body.widget-mode #setup label, body.widget-mode #setup input, body.widget-mode #setup button { display: none; }
  #status { margin-top: 14px; font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; }
  #status.error { color: #b91c1c; }
  #status.ok { color: #15803d; }
  #frame { display: none; width: 100%; height: 100vh; border: none; }
  /* Widget mode's branded stand-in for the plain #setup form while it
     auto-connects -- same mark/wordmark as wigwag.html's own boot splash
     (tracker #167/2275c4a6), shown instead of (not alongside) the raw
     connecting text for as long as things are going normally. Deliberately
     fully static -- no pulse, no sweep (live-reported, Tom: this page
     stays alive and re-renders under it while the real handshake runs, so
     a CSS animation on a persistent element periodically looked like a
     flicker/jump, unlike wigwag.html's own splash which lives in a fresh
     iframe document each time and never has that problem). Light-only:
     this page has no dark-mode support at all today, unlike wigwag.html
     itself. */
  #widget-boot-splash { display:none; position:fixed; inset:0; z-index:400; background:#fcfcfe; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  #widget-boot-splash-mark { display:flex; flex-direction:column; align-items:center; gap:14px; }
  #widget-boot-splash-mark span { font-size:19px; font-weight:700; letter-spacing:-0.005em; color:#27292C; }
</style>
