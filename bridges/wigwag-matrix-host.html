    // trigger (another edit, or the next 5s tick) re-evaluates the
    // threshold/floor fresh regardless.
    const snapshotInFlight = new Set();
    async function pushSnapshotForProject(projectId) {
      if (snapshotInFlight.has(projectId)) return;
      snapshotInFlight.add(projectId);
      try {
        await pushSnapshotForProjectUnlocked(projectId);
      } finally {
        snapshotInFlight.delete(projectId);
      }
    }
    async function pushSnapshotForProjectUnlocked(projectId) {
      const current = readCurrentLocalDoc(projectId);
      // Same exclusion as pushNewLocalEntries's own -- see
      // isUniversallyDerivedBackfillEntry's comment. Only the deterministic
      // created/updated backfill never needs a real, sent copy anywhere;
      // every OTHER legacy-backfill entry (a genuine imported/pasted value,
      // or a custom field's schema) still carries real content only this
      // device has, and must still go out.
      const items = flattenEntries(current).filter(item => !isUniversallyDerivedBackfillEntry(item)).map(item => ({ ...item, projectId }));
      if (!items.length) return;
      // Marked pending in the outbox before sending, same reasoning as
      // pushNewLocalEntries's own: a snapshot always includes EVERY entry
      // (it must be complete and self-sufficient on its own, unlike an
      // incremental push) -- marking here prevents a later
      // pushNewLocalEntries/reconcile pass from treating these as
      // still-unsent and pushing them again separately. Unlike a normal
      // per-entry send, a snapshot failure just rolls the mark back
      // entirely (removed, not 'failed') rather than showing a per-field
      // failed indicator for potentially hundreds of entries at once --
      // the next pushNewLocalEntries/pushSnapshotIfDue pass picks them up
      // again naturally.
      const outbox = pendingOutboxFor(projectId);
      items.forEach(item => outbox.set(pendingEntryKey(item.entry), { status: 'pending', item }));
      sendPendingUpdate(projectId);
      const cutoffSortKey = items.reduce((max, item) => Math.max(max, item.entry.sortKey || 0), 0);
      const snapshotId = crypto.randomUUID ? crypto.randomUUID() : ('snap-' + Date.now() + '-' + Math.random().toString(36).slice(2));
      const plaintextBytes = new TextEncoder().encode(JSON.stringify(items.map(item => core.matrixEventContentFromEntry(item))));
      const { ciphertext, encryption } = await core.encryptSnapshotPayload(plaintextBytes);
      const uploadResult = await transport.uploadSnapshotBlob(ciphertext);
      if (uploadResult.status !== 'ok') {
        console.warn('[wigwag-matrix-host] failed to upload snapshot blob for', projectId, uploadResult);
        items.forEach(item => outbox.delete(pendingEntryKey(item.entry))); // roll back the optimistic mark -- these were never actually sent
        sendPendingUpdate(projectId);
        return;
      }
      const manifestContent = core.matrixEventContentFromSnapshotManifest({ projectId, snapshotId, cutoffSortKey, mxc: uploadResult.mxc, size: ciphertext.length, encryption, createdAt: Date.now() });
      const manifestResult = await transport.sendSnapshotManifest(manifestContent);
      if (manifestResult.status === 'ok') {
        lastSnapshotEntryCount.set(projectId, items.length);
        lastSnapshotAt.set(projectId, manifestContent.createdAt);
        // Live-reported (Tom, 2026-09-28): a fresh bulk import correctly
        // sent exactly one snapshot, but every imported item stayed stuck
        // showing 'pending' in the UI indefinitely. Root cause: the
        // outbox's normal confirmation path (clearConfirmedFromOutbox,
        // called from reconcileIntoLocal) only clears an entry once it
        // sees it in a freshly-recomputed remoteDoc -- and remoteDoc is
        // derived purely from remoteRawEvents, the room's plain
        // work.wigwag.entry timeline. A snapshot's actual content lives in
        // an encrypted media blob referenced by a work.wigwag.snapshot
        // manifest event, which nothing re-resolves back into
        // remoteRawEvents for an ALREADY-bridged project's own ongoing
        // reconcile (that resolution only happens once, in connect()'s
        // initial pull, or when a genuinely NEW project is discovered
        // mid-session) -- so the generic confirmation path could never
        // catch up within the same session; only a full reconnect (which
        // re-runs that initial resolution from scratch) would ever clear
        // these. But a successful snapshot upload+manifest send IS itself
        // direct, complete proof these items are durably in the room --
        // no need to wait for the indirect remoteDoc-membership check this
        // one time. Confirm them immediately -- but marked as a distinct
        // 'confirmed-via-snapshot' status, NOT deleted from the outbox:
        // deleting would make these items indistinguishable from "never
        // attempted" to the very next pushNewLocalEntries pass (remoteKeys
        // won't reflect them either, per the comment above), causing an
        // immediate, separate resend of the exact items this snapshot just
        // successfully delivered -- confirmed live while testing this fix.
        // See pendingEntryKey's own toSend-filter check and
        // computePendingSummary's matching skip for the other two sides
        // of this same convention.
        items.forEach(item => outbox.set(pendingEntryKey(item.entry), { status: 'confirmed-via-snapshot', item }));
        sendPendingUpdate(projectId);
      } else {
        // The blob itself is already uploaded and orphaned at this point
        // (harmless -- nothing references it, and cleaning up superseded/
        // orphaned blobs is explicitly out of scope for now, same as the
        // old chunk-event design never cleaned up superseded snapshots
        // either). Rolling back the outbox mark means a later retry starts
        // completely fresh (a new blob, a new manifest), not a half state.
        console.warn('[wigwag-matrix-host] failed to send snapshot manifest for', projectId, manifestResult);
        items.forEach(item => outbox.delete(pendingEntryKey(item.entry)));
        sendPendingUpdate(projectId);
      }
    }
    // Checked from the live poll's own reconcile step (below) -- a snapshot
    // taken here is purely a threshold-triggered convenience (bounding how
    // large the "replay everything" cost can grow for an active project
    // that was never bulk-imported); multiple viewers independently
    // crossing the threshold around the same time is wasteful but
    // harmless (idempotent, newest-wins on read).
    async function pushSnapshotIfDue(projectId) {
      const current = readCurrentLocalDoc(projectId);
      const entryCount = flattenEntries(current).length;
      const sinceLastCount = entryCount - (lastSnapshotEntryCount.get(projectId) || 0);
      // A project with no tracked snapshot time yet (never snapshotted in
      // this bridge instance's lifetime, and connect() found no existing
      // one to seed from) starts its age clock now, rather than being
      // treated as "infinitely overdue" -- a small/fresh project shouldn't
      // get an immediate, pointless snapshot the moment it's first polled.
      if (!lastSnapshotAt.has(projectId)) lastSnapshotAt.set(projectId, Date.now());
      const sinceLastMs = Date.now() - lastSnapshotAt.get(projectId);
      // Test-only override (never set in production) -- faking real
      // wall-clock elapse across a 24h floor isn't practical (Playwright's
      // clock virtualizes this file's own 5s poll interval too, so
      // bridging the gap would mean firing it thousands of times); a
      // test shrinks the floor itself instead, same in spirit as every
      // other test-introspection hook in this file (window.__wigwagHostStorage
      // etc).
      const maxAgeMs = (typeof window !== 'undefined' && typeof window.__wigwagSnapshotMaxAgeMsOverride === 'number') ? window.__wigwagSnapshotMaxAgeMsOverride : SNAPSHOT_MAX_AGE_MS;
      if (sinceLastCount >= SNAPSHOT_STALENESS_ENTRY_THRESHOLD || sinceLastMs >= maxAgeMs) await pushSnapshotForProject(projectId);
    }

    // Adopts any project this browser holds locally that isn't bridged
    // yet -- an import, "+ New project", or wigwag.html's own
    // delete-fallback (auto-creating a blank project when the last one is
    // deleted) all show up here the same way, and all belong to the room
    // unconditionally in this mode. Two things happen for each one found:
    // its identityId is normalized onto the room's own single
    // bootstrapped identity (wigwag.html's own PROJECTS_KEY storage
    // listener adopts the correction live -- closes the "stuck in Shared
    // with you, can't get back to the room's own scope" trap, since that
    // limbo state never had a reason to exist here), and its full existing
    // history is bulk-pushed to the room tagged with its own id, each
    // entry keeping its real original authorship (nothing is re-signed).
    //
    // No cross-room contamination guard needed here any more (unlike the
    // old shared-origin-localStorage design, tracker #149's original fix)
    // -- this page's own `localStorage` above is a private in-memory Map
    // that only ever exists for THIS bridge instance/room connection, so
    // there's no shared bucket a second room's widget could ever read.
    // identityId correction (a plain import lands with identityId: null,
    // wrong for a mode with no "Shared with you" concept) is now done
    // client-side, by wigwag.html's own persistProjectIndex -- this page
    // has no identity to correct it TO any more.
    function adoptLocalProjects() {
      let projects;
      try { projects = JSON.parse(localStorage.getItem(core.PROJECTS_KEY) || 'null'); } catch (e) { return; }
      if (!projects || !Array.isArray(projects.milestones)) return;
      for (const m of projects.milestones) {
        if (bridgedProjects.has(m.id)) continue;
        adoptOneLocalProject(m.id, m.name);
      }
    }
    // Moderator-gated (tracker f6b39bf0, live-reported rate-limit
    // incident, Tom's explicit call): creating the room's index entry for
    // this project MUST succeed before anything else about it is treated
    // as real. On rejection (a non-moderator), the optimistically-created
    // local project is rolled back (removed from PROJECTS_KEY, which
    // notifies the iframe via the existing wigwag:storage-changed
    // mechanism, same as any other local write) and a distinct
    // wigwag:room-write-rejected message carries a human-readable reason
    // -- never a silent console.warn. This is the second half of the
    // double-send incident's own lesson: a rejected/failed write must
    // never look like it succeeded.
    async function adoptOneLocalProject(projectId, projectName) {
      const createResult = await transport.createProject(projectId, resolvedMatrixUserId);
      if (createResult.status !== 'ok') {
        console.warn('[wigwag-matrix-host] project creation rejected for', projectId, createResult);
        try {
          const current = JSON.parse(localStorage.getItem(core.PROJECTS_KEY) || 'null');
          if (current && Array.isArray(current.milestones)) {
            current.milestones = current.milestones.filter(m => m.id !== projectId);
            localStorage.setItem(core.PROJECTS_KEY, JSON.stringify(current));
          }
        } catch (e) { /* best-effort rollback -- the rejection notice below still fires either way */ }
        localStorage.postMessageToFrame({
          type: 'wigwag:room-write-rejected',
          projectId,
          reason: createResult.status === 'forbidden'
            ? 'Only room moderators can add new projects to this room.'
            : ('Could not add this project to the room (' + createResult.status + (createResult.message ? ': ' + createResult.message : '') + ').')
        });
        return;
      }
      bridgedProjects.set(projectId, { name: projectName, includeUntagged: false });
      pushSnapshotForProject(projectId);
    }

    // Message-based equivalent of the old native `storage` event listener
    // -- the iframe no longer shares real localStorage with this page at
    // all, so instead of reacting to a native event, this reacts to the
    // iframe's own wigwag:local-write messages (see the `localStorage`
    // shim above for the wigwag:hello/wigwag:hello-ack side of the same
    // protocol).
    function onFrameMessage(e) {
      if (!e.data) return;
      if (e.data.type === 'wigwag:hello') {
        if (e.source) e.source.postMessage({
          type: 'wigwag:hello-ack',
          capabilities: { mode: 'room', multiIdentity: false, sharedProjectContext: true },
          snapshot: localStorage.dumpAll(),
          matrixUserId: resolvedMatrixUserId,
          fallbackDisplayName: resolvedDisplayName,
          matrixDeviceId: resolvedMatrixDeviceId,
          // Replays whatever's still outstanding across a plain iframe
          // reload (the host itself, and its in-memory outbox, survive
          // that -- only the iframe's own render state resets), so a
          // reloaded app doesn't briefly show "confirmed" for something
          // still actually pending/failed.
          pendingSummaries: Object.fromEntries([...bridgedProjects.keys()].map(id => [id, computePendingSummary(id)])),
          // Cosmetic/metadata prefs (column order, sort, etc.) are keyed
          // by projectId alone, real localStorage, no room-awareness --
          // predates Room Mode, built for Local Mode's "many unrelated
          // projects in one browser" case. A project id CAN repeat across
          // rooms (more so now that Receive can reuse an original id), so
          // the iframe needs this to compose a room-scoped key itself
          // (roomId:projectId) rather than bleeding those prefs across
          // rooms that happen to share a project id. The iframe otherwise
          // has zero knowledge of which room it's in, by design.
          roomId: roomId,
          // Tracker #169/4f07e72b: a proposal sent (or a moderator status
          // that applies) before this viewer even connected must still
          // show up immediately -- these are real, current Matrix STATE,
          // not something scoped to "while this session has been open".
          // Keyed by project id since a room can hold more than one.
          layoutProposals: currentLayoutProposalsByProjectId(),
          isModerator: currentIsModerator()
        }, '*');
        return;
      }
      // The iframe already has the failed entry sitting in its own local
      // doc (nothing was ever rolled back on failure) -- re-running the
      // normal send pass picks it up naturally via the same toSend
      // computation any other edit would, no separate targeted-retry
      // mechanism needed.
      if (e.data.type === 'wigwag:retry-pending') {
        if (bridgedProjects.has(e.data.projectId)) pushNewLocalEntries(e.data.projectId, { forceRetryFailed: true });
        return;
      }
      // Moderator-gated the same way project creation is (Matrix's own
      // power-level check on the real send) -- a rejection surfaces via
      // the same wigwag:room-write-rejected notice, never a silent drop.
      // On the widget transport, 'forbidden' is a best-guess coercion of
      // ANY rejected send_event (Element reports a capability rejection
      // the same way as a real power-level one -- see sendLayoutProposal's
      // own comment), so it's not reliably a real moderator rejection --
      // appending the underlying message (when there is one) gives a real
      // signal to tell the two apart instead of always blaming moderators.
      if (e.data.type === 'wigwag:propose-layout') {
        const content = core.matrixStateEventContentFromLayoutProposal(e.data.content || {});
        transport.sendLayoutProposal(e.data.projectId, content).then(result => {
          if (result.status === 'ok') return;
          localStorage.postMessageToFrame({
            type: 'wigwag:room-write-rejected',
            reason: result.status === 'forbidden'
              ? ('Only room moderators can propose a table layout.' + (result.message ? ' (' + result.message + ')' : ''))
              : ('Could not send the layout proposal (' + result.status + (result.message ? ': ' + result.message : '') + ').')
          });
        });
        return;
      }
      if (e.data.type !== 'wigwag:local-write') return;
      localStorage.applyFromFrame(e.data.key, e.data.newValue);
      if (e.data.key === core.PROJECTS_KEY) { adoptLocalProjects(); return; }
      for (const id of bridgedProjects.keys()) {
        if (e.data.key === docKey(id)) { pushNewLocalEntries(id); return; }
      }
    }

    // Split from a single start() into connect() + openProject() (tracker
    // #149): the room's own timeline has to actually be pulled before
    // it's possible to know how many projects it holds, and if there's
    // more than one, a human needs to pick which one before anything
    // gets bootstrapped/shown -- start() used to do all of that in one
    // uninterruptible pass, assuming exactly one project always existed.
    // Test-only hook (never called in production) -- lets a test invoke
    // pushSnapshotForProject twice without awaiting either, to verify the
    // snapshotInFlight lock deterministically rather than trying to time-
    // align a real concurrent overlap via wall-clock delays. Same spirit
    // as this file's other test-introspection hooks (window.__wigwagHostStorage
    // etc).
    if (typeof window !== 'undefined') window.__wigwagTestForcePushSnapshot = pushSnapshotForProject;
    return {
      // Connects and discovers what's there -- does NOT bootstrap or show
      // anything yet. Caller decides what to do with the discovered list
      // (auto-open the only one, or show a picker).
      async connect() {
        const probe = await transport.probeAccess();
        if (probe.status !== 'can-read-write') return probe;

        // Project index (tracker f6b39bf0, live-reported rate-limit
        // incident) -- a real current-state read, reliable regardless of
        // room chattiness (see discoverProjects's own comment). Best-
        // effort: a transport error here must not block connecting
        // altogether -- discoverProjects's own timeline-scan/grandfather-
        // clause fallback still runs regardless below.
        //
        // DIRECT transport only (2026-10-03, same reasoning/precedent as
        // layout-proposal/power-levels/room-create above): the widget
        // transport's own pullMore() now backfills work.wigwag.project via
        // the same reliable since-cursor timeline read (see its own
        // comment), which discoverProjects's unconditional scan of
        // remoteRawEvents already picks up below -- calling this
        // DEDICATED current-state fetch for the widget transport too
        // would be redundant at best, and at worst risk a stale result
        // winning (same array-order "last wins" hazard already documented
        // for the other three types). The direct transport still needs
        // its own dedicated /state read here -- same unresolved gap as
        // those three: its own full-timeline pull has no guarantee of
        // reaching a project created long before this reconnect.
        let indexedProjectIds = [];
        if (typeof transport.onStateUpdate !== 'function') {
          const indexResult = await transport.getProjectIndex();
          if (indexResult.status === 'ok') indexedProjectIds = indexResult.projectIds;
        }

        // Live-reported (Tom, 2026-09-29) -- see isModeratorForStateEvent's
        // own comment in wigwag-core.js. Best-effort like the reads above:
        // a transport error here must not block connecting altogether,
        // and currentIsModerator() already treats a null roomCreatorSender
        // as "no creator override available" rather than a crash.
        //
        // BOTH transports get this read (2026-10-03 correction -- this
        // was briefly gated to direct-only for a few hours under the
        // mistaken belief that room-create needed the same "convert to
        // backfill" fix as layout-proposal; it doesn't, see
        // getRoomCreator's own comment for why that reasoning didn't
        // actually apply here). But only the WIDGET transport gets a
        // RETRY CASCADE -- its confirmed failure mode was a one-shot
        // fetch losing a transient capability-approval race, specific to
        // the postMessage handshake widgets go through. The direct
        // transport's plain HTTP GET has no equivalent race (it either
        // succeeds or fails outright) and never needed a retry before
        // tonight -- adding one unconditionally here briefly turned every
        // ordinary connect() on a room with no power_levels/room_create
        // mock configured into a guaranteed multi-second stall (confirmed
        // live as a real regression), the same bug class already caught
        // and fixed once for the test fixture defaults earlier tonight,
        // just reappearing from the opposite direction. An empty delay
        // list collapses the loop to exactly one attempt.
        const ROOM_CREATOR_CONNECT_RETRY_DELAYS_MS = (typeof transport.onStateUpdate === 'function') ? [500, 1000, 1500] : [];
        let roomCreatorResult = { status: 'error', sender: null };
        for (let attempt = 0; ; attempt++) {
          roomCreatorResult = await transport.getRoomCreator();
          if ((roomCreatorResult.status === 'ok' && roomCreatorResult.sender) || attempt >= ROOM_CREATOR_CONNECT_RETRY_DELAYS_MS.length) break;
          await new Promise(resolve => setTimeout(resolve, ROOM_CREATOR_CONNECT_RETRY_DELAYS_MS[attempt]));
        }
        if (roomCreatorResult.status === 'ok' && roomCreatorResult.sender) roomCreatorSender = roomCreatorResult.sender;

        const initialPull = await transport.pullInitial();
        if (initialPull.status !== 'ok') return initialPull;

        const legacyDefaultProjectId = deriveProjectId(roomId);
        // Room snapshot integration (tracker f6b39bf0/#153, f1c7098f/#154)
        // -- see WIGWAG_MATRIX_SNAPSHOT_TYPE's own comment in
        // wigwag-core.js. A resolved snapshot for a project REPLACES that
        // project's older raw entries entirely (both represent the exact
        // same signed history -- keeping both would double-count every
        // pre-cutoff entry). Snapshot items are re-wrapped as synthetic
        // work.wigwag.entry-shaped events so discoverProjects/
        // hydrateProjectFromMatrixTimeline need ZERO changes -- they can't
        // tell a snapshot-sourced entry from a directly-pulled one, by
        // design. A project with no (resolvable) snapshot behaves exactly
        // as before -- this is strictly additive, never a regression from
        // not having one yet. Resolving is async now (a real
        // download+decrypt per project), unlike the old chunk-reassembly
        // which came for free from the already-pulled raw events -- worth
        // its cost, since it also means there's no partial/incomplete
        // state to reason about any more: a snapshot either fully resolves
        // or it doesn't (see resolveSnapshotPayload's own comment).
        const manifestsByProject = core.findLatestSnapshotManifests(initialPull.events);
        const snapshotsByProject = new Map(); // projectId -> {cutoffSortKey, createdAt, items}
        for (const [projectId, manifest] of manifestsByProject) {
          const resolved = await core.resolveSnapshotPayload(manifest, { downloadFn: transport.downloadSnapshotBlob });
          if (resolved) snapshotsByProject.set(projectId, { cutoffSortKey: manifest.cutoffSortKey, createdAt: manifest.createdAt, items: resolved.items });
        }
        const tailItems = core.decodeAllMatrixEntryItems(initialPull.events).filter(item => {
          const pid = item.projectId || legacyDefaultProjectId;
          const snap = snapshotsByProject.get(pid);
          return !snap || (item.entry.sortKey || 0) > snap.cutoffSortKey;
        });
        const snapshotItems = [].concat(...[...snapshotsByProject.values()].map(s => s.items));
        // work.wigwag.project state events are carried through separately
        // (re-wrapping loses them, since matrixEventContentFromEntry has
        // no concept of them) -- discoverProjects's own timeline-scan
        // branch (the grandfather-clause/live-discovery path) needs them
        // present in remoteRawEvents in their real shape, not decoded as
        // an entry.
        const projectStateEvents = initialPull.events.filter(ev => ev && ev.type === core.WIGWAG_MATRIX_PROJECT_STATE_TYPE);
        // Layout proposal (tracker #169/4f07e72b) -- Live-reported (Tom,
        // 2026-10-02): even a fresh RELOAD didn't pick up a genuinely new
        // layout proposal -- the WILDCARD "current state" read
        // (state_key:true, needed because a proposal's state_key is the
        // project id, unknown in advance) can come back stale while still
        // reporting status:'ok', which no amount of retrying a few
        // hundred ms apart will ever catch. Root fix: also requested with
        // receive.event:TYPE (see WIDGET_CAPABILITIES' own comment),
        // unlocking the exact same proven-reliable plain timeline read as
        // ordinary entries, which pullMore()'s one-time backfill now
        // includes. This is the ONLY source for the WIDGET transport, for
        // state that predates this connection AND state sent during it.
        // power_levels/room_create do NOT belong in this filter
        // (2026-10-03 correction) -- see getPowerLevels'/getRoomCreator's
        // own comment for why a fixed-state_key read never had this
        // problem and didn't need the same fix.
        const layoutAndPowerLevelEvents = initialPull.events.filter(ev => ev && ev.type === core.WIGWAG_MATRIX_LAYOUT_PROPOSAL_TYPE);
        let seededExtraStateEvents = [];
        // Layout proposal, DIRECT transport only: its own dedicated
        // /state read is still needed for a proposal that PRE-DATES this
        // connection -- confirmed live by an earlier regression that its
        // mock (and plausibly a real homeserver's paginated /messages
        // too) doesn't guarantee surfacing one through the timeline
        // alone. A proposal SENT during the direct transport's own
        // session already rides its full unfiltered timeline pull
        // regardless. The widget transport gets this entirely from
        // layoutAndPowerLevelEvents above -- calling this dedicated fetch
        // for it too would risk a stale wildcard read getting concat'd in
        // AFTER the reliable one and incorrectly winning
        // (latestStateEventOfType takes the LAST matching array entry,
        // not the freshest by timestamp).
        if (typeof transport.onStateUpdate !== 'function') {
          const layoutProposalsResult = await transport.getLayoutProposals();
          if (layoutProposalsResult.status === 'ok' && layoutProposalsResult.proposalsByProjectId) {
            for (const [pid, proposal] of Object.entries(layoutProposalsResult.proposalsByProjectId)) {
              seededExtraStateEvents.push({ type: core.WIGWAG_MATRIX_LAYOUT_PROPOSAL_TYPE, state_key: pid, content: core.matrixStateEventContentFromLayoutProposal(proposal) });
            }
          }
        }
        // Power levels -- BOTH transports get this read (2026-10-03
        // correction, same story as getRoomCreator above): a single fixed
        // state_key, no wildcard-discovery problem, no confirmed
        // staleness -- the real bug was a one-shot no-retry fetch losing
        // a transient capability-approval race on the widget transport,
        // fixed by retrying the SAME dedicated read rather than switching
        // its shape. Retry cascade gated to the widget transport only,
        // same reasoning and same live-confirmed regression as
        // getRoomCreator's own retry just above -- a room with no
        // power_levels configured on the direct transport's mock is a
        // real, common, FAST "ok, content: null" answer, not a failure
        // worth paying a multi-second cascade to retry.
        const POWER_LEVELS_CONNECT_RETRY_DELAYS_MS = (typeof transport.onStateUpdate === 'function') ? [500, 1000, 1500] : [];
        let powerLevelsResult = { status: 'error', content: null };
        for (let attempt = 0; ; attempt++) {
          powerLevelsResult = await transport.getPowerLevels();
          if ((powerLevelsResult.status === 'ok' && powerLevelsResult.content) || attempt >= POWER_LEVELS_CONNECT_RETRY_DELAYS_MS.length) break;
          await new Promise(resolve => setTimeout(resolve, POWER_LEVELS_CONNECT_RETRY_DELAYS_MS[attempt]));
        }
        if (powerLevelsResult.status === 'ok' && powerLevelsResult.content) {
          seededExtraStateEvents.push({ type: 'm.room.power_levels', state_key: '', content: powerLevelsResult.content });
        }
        remoteRawEvents = snapshotItems.concat(tailItems).map(item => ({ type: core.WIGWAG_MATRIX_ENTRY_TYPE, content: core.matrixEventContentFromEntry(item) })).concat(projectStateEvents).concat(layoutAndPowerLevelEvents).concat(seededExtraStateEvents);
        for (const [projectId, snap] of snapshotsByProject) {
          lastSnapshotEntryCount.set(projectId, snap.items.length);
          if (snap.createdAt) lastSnapshotAt.set(projectId, snap.createdAt);
        }

        const legacyDefaultProjectName = (await transport.getRoomName()) || ('Matrix room ' + roomId);
        const projects = discoverProjects(remoteRawEvents, legacyDefaultProjectId, legacyDefaultProjectName, indexedProjectIds);

        return { status: 'ok', projects, legacyDefaultProjectId };
      },
      // Bootstraps and reconciles EVERY project connect() discovered --
      // tracker #149, live-reported: the room's own data already tells you
      // every project that exists, so there's no reason to make a human
      // pick just one before anything is usable. All of them become
      // immediately available through wigwag.html's own normal switcher
      // (left fully live -- identity chrome is hidden by wigwag.html
      // itself now, driven by wigwag:hello-ack's capabilities);
      // defaultProjectId
      // picks which one is actually shown first (today: the room's own
      // legacy/default project, always present in connect()'s discovered
      // list; a future refinement could remember per-viewer "last looked
      // at" instead, the same way wigwag.html's own
      // lastActiveProjectByIdentity already does for identity switches).
      async openAll(projects, defaultProjectId) {
        // Resolved unconditionally, regardless of whether any project
        // exists yet (tracker f6b39bf0: a genuinely empty room -- no
        // projects, nothing to bootstrap -- still needs to tell wigwag.html
        // WHO is connected, so its own empty-state UI can render something
        // other than an unknown identity). The per-project loop below used
        // to be the only place this got set, via bootstrapLocalStorage's
        // own whoAmI call -- that loop simply never running for an empty
        // room left it permanently null otherwise. Checked here, upfront,
        // rather than only inside bootstrapLocalStorage's own per-project
        // check (still present, still fires for the non-empty case) --
        // that check simply never ran at all when projects=[], which
        // would have silently let a whoAmI failure through to a real
        // connect (fails-loudly was the original, pre-existing intent for
        // this failure -- never a placeholder identity).
        resolvedMatrixUserId = await transport.whoAmI(fallbackUserId);
        if (!resolvedMatrixUserId) return { status: 'no-identity', message: 'Could not determine this session\'s Matrix user id.' };
        resolvedDisplayName = fallbackDisplayName;
        resolvedMatrixDeviceId = (transport.getDeviceId && transport.getDeviceId()) || fallbackDeviceId || null;
        for (const p of projects) {
          const isDefault = p.id === deriveProjectId(roomId);
          bridgedProjects.set(p.id, { name: p.label, includeUntagged: isDefault });

          const remoteDoc = computeRemoteDocFor(p.id);
          const bootstrapResult = await bootstrapLocalStorage(p.id, p.label, docStorable({ fieldDefs: remoteDoc.fields, projectHistory: remoteDoc.projectHistory, issues: remoteDoc.issues }), transport, fallbackUserId, fallbackDisplayName);
          if (bootstrapResult.status !== 'ok') return bootstrapResult;
          // A pre-existing local project at this same derived id may already
          // have entries the initial remote pull doesn't yet know about
          // (e.g. an earlier session's local edits that never made it out) --
          // reconcile once, immediately, before wiring up the live bridge.
          reconcileIntoLocal(p.id);
        }
        // bootstrapLocalStorage sets activeMilestoneId on every call --
        // after bootstrapping the whole discovered set, pin it back to the
        // one actually meant to be shown. A genuinely empty room (projects
        // = [], defaultProjectId still the derived legacy id even though
        // nothing bootstrapped it) leaves PROJECTS_KEY unset entirely --
        // nothing to pin, and wigwag.html's own empty-state handles it.
        try {
          const store = JSON.parse(localStorage.getItem(core.PROJECTS_KEY) || 'null');
          if (store) { store.activeMilestoneId = defaultProjectId; localStorage.setItem(core.PROJECTS_KEY, JSON.stringify(store)); }
        } catch (e) { /* non-fatal -- wigwag.html's own switcher still works, just may default to the wrong tab */ }
        // Any OTHER project already sitting in this browser's local
        // project list, from BEFORE this connection and not among the
        // room's own discovered set (a previous, disconnected import; a
        // stray leftover), gets adopted too, right from the start.
        adoptLocalProjects();

        window.addEventListener('message', onFrameMessage);
        bridgeTimer = setInterval(async () => {
          const result = await transport.pullMore();
          if (result.status !== 'ok') return;
          // Tracker f6b39bf0's cadence-floor follow-up: checked on EVERY
          // successful poll tick, not just ones that found new events --
          // the whole point of the time-based floor is catching a project
          // that's gone quiet for a long time, which by definition never
          // has new events to reconcile. The old structure (nested inside
          // the "found new events" branch below) meant a truly quiet
          // project's age never got checked at all.
          for (const id of bridgedProjects.keys()) await pushSnapshotIfDue(id);
          // Live-reported (Tom, 2026-10-02): "still looks pretty polly" --
          // the layout-proposal/power-levels NETWORK reads were removed
          // for the widget transport, but the two postMessageToFrame calls
          // at the end of this tick kept firing (and recomputing their
          // payload, incl. a now-removed diagnostic console.log) on EVERY
          // tick regardless of whether moderator status or any proposal
          // could possibly have changed -- the exact kind of unconditional
          // busywork this whole effort was meant to eliminate, just
          // without a network call attached. These two flags track
          // whether anything THIS tick could actually have changed either
          // one; the two pushes at the bottom of this function now only
          // fire when their own flag is true.
          let layoutProposalsMightHaveChanged = await processNewRemoteEvents(result.events);
          let moderatorMightHaveChanged = false;
          // Live-reported (Tom, 2026-10-02): this used to unconditionally
          // re-fetch layout-proposals/power-levels here every tick (see the
          // now-removed comment this replaces, preserved in git history),
          // for two reasons: (a) "switch room and back" in a real Matrix
          // client doesn't reliably force a fresh handshake with an
          // already-alive iframe, so something had to independently
          // converge it on the truth; (b) the DIRECT transport has no push
          // mechanism at all -- its pullMore() pulls the room's plain
          // timeline, which power_levels never rides (see the connect-time
          // seed block's own comment) -- so a re-fetch was the ONLY way it
          // ever discovers an externally-changed power_levels post-connect.
          // Reason (a) no longer applies to the WIDGET transport: it has a
          // real push channel for exactly this (onStateUpdate/
          // onPushedStateUpdate below, registered once the widget has the
          // receive.state_event:TYPE capability for a type -- already
          // granted for both layout-proposal and power_levels, and already
          // proven live for layout-proposal pushes). Tom's explicit call
          // (2026-10-02): try relying on push alone for the widget
          // transport and see if it holds up without this poll, rather
          // than keeping both indefinitely. Reason (b) still fully applies
          // to the direct transport, which has no push channel of any
          // kind -- gated on transport.onStateUpdate's presence, the same
          // signal already used below to decide whether to register the
          // push callback at all, so this and that registration can never
          // disagree about which transport they're describing.
          if (typeof transport.onStateUpdate !== 'function') {
            const layoutProposalsResult = await transport.getLayoutProposals();
            if (layoutProposalsResult.status === 'ok' && layoutProposalsResult.proposalsByProjectId) {
              for (const [pid, proposal] of Object.entries(layoutProposalsResult.proposalsByProjectId)) {
                const content = core.matrixStateEventContentFromLayoutProposal(proposal);
                const existing = latestStateEventOfType(core.WIGWAG_MATRIX_LAYOUT_PROPOSAL_TYPE, pid);
                // Never regress to an older proposal than one already known
                // (from an earlier poll) -- belt and braces, costs nothing.
                if (existing && (existing.content.proposedAt || 0) > (content.proposedAt || 0)) continue;
                if (!existing || JSON.stringify(existing.content) !== JSON.stringify(content)) {
                  remoteRawEvents = remoteRawEvents.concat([{ type: core.WIGWAG_MATRIX_LAYOUT_PROPOSAL_TYPE, state_key: pid, content }]);
                  layoutProposalsMightHaveChanged = true;
                }
              }
            }
            const powerLevelsResult = await transport.getPowerLevels();
            if (powerLevelsResult.status === 'ok' && powerLevelsResult.content) {
              const existingPL = latestStateEventOfType('m.room.power_levels', '');
              if (!existingPL || JSON.stringify(existingPL.content) !== JSON.stringify(powerLevelsResult.content)) {
                remoteRawEvents = remoteRawEvents.concat([{ type: 'm.room.power_levels', state_key: '', content: powerLevelsResult.content }]);
                moderatorMightHaveChanged = true;
              }
            }
          }
          // Live-reported (Tom, 2026-10-02): the room creator's own
          // moderator access depends on roomCreatorSender, which connect()
          // resolves via transport.getRoomCreator() exactly ONCE, with no
          // retry -- unlike every other read here, which gets a fresh
          // chance every 5s tick. Confirmed live via a now-removed
          // temporary diagnostic log on currentIsModerator: powerLevelsContent
          // correctly populated (benefiting from this same per-tick
          // recheck) while roomCreatorSender stayed null for the room
          // creator's entire session -- that one-shot connect-time call
          // lost the exact
          // same capability-approval race pullInitial's own retry loop
          // exists to absorb (see its comment), and with no second
          // attempt, there was nothing to self-heal it. Retried here every
          // tick, same as layout proposals/power levels above, until it
          // resolves -- once a real sender is found it never needs
          // checking again (room creation is immutable), so this becomes
          // a no-op from then on.
          if (!roomCreatorSender) {
            const roomCreatorResult = await transport.getRoomCreator();
            if (roomCreatorResult.status === 'ok' && roomCreatorResult.sender) { roomCreatorSender = roomCreatorResult.sender; moderatorMightHaveChanged = true; }
          }
          // Power levels, WIDGET transport backstop (2026-10-03, symmetric
          // with room-creator just above): the connect-time retry is
          // bounded and could still exhaust without success. The direct
          // transport already gets a continuous per-tick recheck further
          // up (gated to it specifically); the widget transport doesn't,
          // on the theory that its connect-time fetch is reliable enough
          // not to need one -- but if that bounded retry ever does
          // exhaust, there would otherwise be nothing left to self-heal
          // it. Keeps trying here every tick until a value is found, then
          // becomes a no-op forever.
          if (typeof transport.onStateUpdate === 'function' && !latestStateEventOfType('m.room.power_levels', '')) {
            const powerLevelsResult = await transport.getPowerLevels();
            if (powerLevelsResult.status === 'ok' && powerLevelsResult.content) {
              remoteRawEvents = remoteRawEvents.concat([{ type: 'm.room.power_levels', state_key: '', content: powerLevelsResult.content }]);
              moderatorMightHaveChanged = true;
            }
          }
          if (layoutProposalsMightHaveChanged) {
            localStorage.postMessageToFrame({ type: 'wigwag:layout-proposals', proposalsByProjectId: currentLayoutProposalsByProjectId() });
          }
          if (moderatorMightHaveChanged) {
            localStorage.postMessageToFrame({ type: 'wigwag:moderator-status', isModerator: currentIsModerator() });
          }
        }, 5000);

        return { status: 'ok', projectId: defaultProjectId };
      },
      stop() {
        window.removeEventListener('message', onFrameMessage);
        if (bridgeTimer) clearInterval(bridgeTimer);
      }
    };
  }

  // A room bridged here is one shared "project holder" (tracker #149,
  // live-reported): switching or creating PROJECTS must stay fully live
  // (that's the whole point of the picker/discovery work above) -- what
  // shouldn't be visible or switchable in a widget is the IDENTITY concept
  // itself. wigwag.html's own identity system (multiple named identities,
  // each with its own signing key, switchable/creatable from the same
  // switcher menu) exists for its normal multi-identity desktop use; a
  // room-backed viewer already has exactly one identity, auto-bootstrapped
  // and keyed to their own Matrix user id (see bootstrapLocalStorage
  // above) -- there is nothing useful to switch TO, and exposing the UI
  // for it (add identity, per-identity settings) only invites exactly the
  // confusion Tom reported. wigwag.html is iframed completely unmodified,
  // so this is done from out here with injected CSS once the iframe
  // loads, rather than teaching wigwag.html anything about being embedded:
  // the switcher's left column (the identity/"scope" list -- scope rows,
  // the settings cog on each, "Add identity...") has no testid of its own,
  // so it's targeted structurally as switcher-menu's first child (see the
  // markup: two un-testid'd wrapper divs are switcher-menu's only two
  // top-level children, left = identity list, right = project list); the
  // header's identity breadcrumb (identity-title-prefix) and the "/"
  // separator right after it go the same way. The project list (right
  // column) and everything else in the switcher is untouched.
  //
  // NOTE: an earlier version of this also hid "Delete project", to guard
  // against wigwag.html's own "never leave zero projects" fallback
  // (deleting the last project auto-creates a disconnected local one --
  // the actual cause of a live two-different-"Untitled Project 1"s
  // incident). Reverted on Tom's explicit call: deleting must stay
  // available. That fallback behavior is still a real gap for the
  // room-bridged case -- not solved here, deliberately left alone rather
  // than guessed at again.
  //
  // hideIdentityChrome (the CSS-injection version of the above) is gone --
  // wigwag.html now hides this itself, driven by the real
  // `sharedProjectContext`/`multiIdentity` capabilities handed over in
  // wigwag:hello-ack, instead of being puppeted from out here after the
  // fact. See wigwag.html's own switcher rendering.
  // Split in two (tracker #167/2275c4a6 follow-up, live-reported: "static
  // host splash -> pulsing/sweeping real splash -> app" -- wigwag.html has
  // its OWN boot splash, meant for genuine standalone use; nested in here,
  // showing #frame as soon as the Matrix-level connect succeeds let that
  // second splash become visible too, right after this page's own. #frame
  // now loads silently in the background (display:none doesn't pause an
  // iframe's own JS/rendering) the whole time wigwag.html is booting --
  // which now skips its own splash entirely when embedded, see its own
  // renderVals -- and is only revealed once wigwag.html itself says it has
  // real content ready (the wigwag:ready listener below). One visible
  // loading treatment for the whole wait, not two in sequence.
  function startLoadingFrame() {
    const frame = $('frame');
    localStorage.attachFrame(frame);
    frame.src = '../wigwag.html';
  }
  function revealFrame() {
    $('setup').style.display = 'none';
    const splash = $('widget-boot-splash');
    if (splash) splash.style.display = 'none';
    const frame = $('frame');
    frame.style.display = 'block';
    // Tracker #167/2275c4a6 follow-up, live-reported "table resizes
    // itself after rendering": #frame sat display:none for part of boot
    // (this whole startLoadingFrame/revealFrame split), during which any
    // measurement wigwag.html took of its own layout (table overflow,
    // etc.) necessarily saw zero dimensions -- a hidden iframe's content
    // has no real layout at all, confirmed empirically, not merely
    // "unpainted". Double rAF lets a real paint happen first, so this
    // lands against actual, non-zero layout.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (frame.contentWindow) frame.contentWindow.postMessage({ type: 'wigwag:revealed' }, '*');
    }));
  }
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'wigwag:ready' && e.source === $('frame').contentWindow) revealFrame();
  });

  // Shared by both transports once connect() has succeeded: bootstraps
  // and bridges EVERY discovered project (tracker #149, live-reported --
  // no "which project should everybody see?" prompt; the room's own data
  // already tells you what's there, and wigwag.html's own switcher is the
  // real way to move between them once shown). Shows the room's own
  // legacy/default project first.
  async function proceedAfterConnect(bridge, connectResult, onOpenFail) {
    setStatus('Opening…');
    const projects = connectResult.projects;
    // legacyDefaultProjectId isn't always one of the discovered projects
    // (a room holding only explicitly-tagged projects, no legacy/untagged
    // content at all, never adds it -- see discoverProjects) -- fall back
    // to whichever project actually exists.
    const defaultProjectId = projects.some(p => p.id === connectResult.legacyDefaultProjectId)
      ? connectResult.legacyDefaultProjectId
      : (projects[0] ? projects[0].id : connectResult.legacyDefaultProjectId);
    const openResult = await bridge.openAll(projects, defaultProjectId);
    if (openResult.status === 'ok') { startLoadingFrame(); return; }
    onOpenFail(openResult);
  }

  // ----- Entry point ------------------------------------------------------

  const widgetContext = getWidgetContext();
  if (widgetContext) {
    // No form, no user input at all: the room, the viewer, and access are
    // all already implied by being embedded. Per Tom's own call, a
    // widget-embedded instance is locked to this one room -- there's
    // nothing to pick, so no Connect Remote / switcher entry points are
    // shown either (there's simply no UI for them here to begin with).
    document.body.classList.add('widget-mode');
    // The prehide <style> (injected synchronously in <head>, before
    // #setup could ever paint) has done its job -- from here on,
    // visibility is this script's job: show the branded splash instead
    // of the plain form/status text while things are going normally,
    // falling back to #setup (see setStatus's own error branch) only if
    // something actually goes wrong.
    const prehide = document.getElementById('__wigwag_prehide_setup');
    if (prehide) prehide.remove();
    // Removing the prehide tag alone only stops FORCING #setup hidden --
    // without an explicit replacement, #setup reverts to its own default
    // visibility (block) underneath the splash, which is still covered
    // visually (the splash is a higher-z-index fixed overlay) but now
    // takes up real space in normal document flow, causing exactly the
    // reflow/repaint "flicker" live-reported here. Hide it explicitly
    // instead of relying on the overlay to merely cover it.
    $('setup').style.display = 'none';
    const splash = $('widget-boot-splash');
    if (splash) splash.style.display = 'flex';
    setStatus('Connecting…');
    if (!widgetContext.roomId) {
      setStatus('This widget was not registered with a $matrix_room_id in its URL -- cannot tell which room to use.', 'error');
    } else {
      const transport = createWidgetTransport(widgetContext);
      const bridge = createMatrixBridge(transport, widgetContext.roomId, widgetContext.userId, widgetContext.displayName, widgetContext.deviceId);
      bridge.connect().then(async (connectResult) => {
        if (connectResult.status !== 'ok') {
          // Every widget-mode failure this early is plausibly the same root
          // cause: Element gates each requested capability (read/send
          // work.wigwag.entry) behind its own user-facing approval prompt,
          // shown once when the widget first loads -- a dismissed or
          // never-shown prompt looks like an ordinary protocol error
          // ("Cannot read room events of this type") with nothing in this
          // file able to distinguish it from a real one. Surfacing the hint
          // unconditionally is cheap and, worst case, irrelevant noise.
          setStatus('Could not connect (' + connectResult.status + (connectResult.message ? ': ' + connectResult.message : '') + ').\n\nIf this is the first time this widget has loaded in this room, check that Element\'s widget-permissions prompt was approved -- try removing and re-adding the widget if you\'re not sure one appeared.', 'error');
          return;
        }
        await proceedAfterConnect(bridge, connectResult, (openResult) => {
          setStatus('Could not open project (' + openResult.status + (openResult.message ? ': ' + openResult.message : '') + ').', 'error');
        });
      }).catch((e) => setStatus('Unexpected error: ' + e.message, 'error'));
    }
  } else {
    connectBtn.addEventListener('click', async () => {
      const homeserverUrl = $('homeserverUrl').value.trim();
      let accessToken = $('accessToken').value.trim();
      let roomId = $('roomId').value.trim();
      if (!homeserverUrl || !accessToken || !roomId) { setStatus('All three fields are required.', 'error'); return; }

      connectBtn.disabled = true;
      setStatus('Connecting…');
      try {
        if (roomId.startsWith('#')) {
          const resolved = await core.resolveMatrixRoomAlias({ fetchImpl: fetch, homeserverUrl, accessToken, alias: roomId });
          if (resolved.status !== 'ok') { setStatus('Could not resolve room alias "' + roomId + '" (' + resolved.status + (resolved.message ? ': ' + resolved.message : '') + ').', 'error'); connectBtn.disabled = false; return; }
          roomId = resolved.roomId;
        }
        const transport = createDirectTransport({ homeserverUrl, accessToken, roomId });
        const bridge = createMatrixBridge(transport, roomId, null);
        const connectResult = await bridge.connect();
        if (connectResult.status !== 'ok') {
          const messages = {
            'no-access': 'This token\'s account is not joined to that room (or the room id is wrong).',
            error: 'Matrix error: ' + (connectResult.message || 'unknown')
          };
          setStatus(messages[connectResult.status] || ('Could not connect (' + connectResult.status + ').' + (connectResult.message ? ' ' + connectResult.message : '')), 'error');
          connectBtn.disabled = false;
          return;
        }
        setStatus('Connected.', 'ok');
        await proceedAfterConnect(bridge, connectResult, (openResult) => {
          setStatus('Could not open project (' + openResult.status + (openResult.message ? ': ' + openResult.message : '') + ').', 'error');
          connectBtn.disabled = false;
        });
      } catch (e) {
        setStatus('Unexpected error: ' + e.message, 'error');
        connectBtn.disabled = false;
      }
    });
  }
})();
</script>
</body>
</html>
