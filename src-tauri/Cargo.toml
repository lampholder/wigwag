[package]
name = "wigwag"
version = "0.1.0"
description = "Git-native project tracker"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Connected Sources (Phase 1). reqwest pinned to match the version already
# pulled in transitively by tauri-plugin-updater (confirmed via `cargo
# tree -i reqwest`) rather than letting two major versions resolve side
# by side. keyring's "v1" feature (the default) bundles exactly the three
# native-keychain backends needed -- macOS Keychain, Windows Credential
# Manager, Linux Secret Service via zbus -- confirmed directly against
# the real crates.io sparse index (the crate restructured around a
# keyring-core + backend-store model since the apple-native/windows-native/
# sync-secret-service feature names from an older major version, which an
# earlier, unverified pass at this Cargo.toml line assumed).
reqwest = { version = "0.13", features = ["json"] }
keyring = "4"

[[bin]]
name = "wigwag"
path = "src/main.rs"
