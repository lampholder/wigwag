<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>fake widget host</title></head>
<body style="margin:0">
<!--
  A disposable stand-in for a real Matrix client's widget host (Element,
  etc.), implementing just enough of the Widget API (MSC2762) postMessage
  protocol to drive wigwag-matrix-host.html's widget-transport code path
  end to end. This proves the PROTOCOL HANDLING in wigwag-matrix-host.html
  is self-consistent -- it does NOT prove real Element compatibility,
  which the plan (encapsulated-waddling-gizmo.md) is explicit needs a
  manual smoke test against a real client instead. See tests/matrix-host.spec.js
  ("widget-embedded transport") for how this is driven.
-->
<iframe id="widget" style="width:100vw;height:100vh;border:none"></iframe>
<script>
(function () {
  const cfg = Object.assign({
    widgetId: 'test-widget-1', roomId: '!fakeroom:example.org', userId: '@fake-user:example.org',
    displayName: 'Fake User', roomName: '', initialEntries: [], rejectReadEventsTimes: 0, dropReadEventsTimes: 0,
    // Project index (tracker f6b39bf0) -- simulates a non-moderator's power
    // level being too low for a work.wigwag.project state send, same as the
    // direct transport's mocked 403.
    forbidStateEventType: null,
    // Media-blob snapshots (tracker f6b39bf0's rate-limit fix, MSC4039) --
    // rejectUploadTimes simulates a real homeserver-side upload rejection
    // (e.g. a size cap) N times before succeeding; Infinity for "never
    // succeeds".
    rejectUploadTimes: 0,
    // Pre-seeds the media store for a RECONNECT test -- a fresh
    // gotoFakeWidgetHost() call is a genuinely new page (mediaStore wiped),
    // so a second connect() resolving a snapshot uploaded by an earlier
    // session needs its blob handed back in explicitly. { mxc, bytes }
    // pairs; bytes as a plain array (JSON-serializable through addInitScript).
    seedMediaBlobs: [],
    // Tracker #169/4f07e72b: seeds a real m.room.power_levels state event
    // (content object, e.g. {users: {'@fake-user:example.org': 50},
    // users_default: 0, state_default: 50}) -- read via
    // getPowerLevels()/isModeratorForStateEvent, same as the direct
    // transport's own `powerLevels` mock option. Omit to simulate a room
    // with no power_levels event at all (fails closed -- nobody is a
    // moderator).
    powerLevels: null
  }, window.__fakeHostConfig || {});
  let uploadRejectRemaining = cfg.rejectUploadTimes;
  let rejectReadEventsRemaining = cfg.rejectReadEventsTimes;
  let dropReadEventsRemaining = cfg.dropReadEventsTimes;

  window.__state = { sentEntries: [], sentStateEvents: [], pendingEntries: cfg.initialEntries.slice(), requestedCapabilities: null, supportedApiVersionsReply: null, uploadedSnapshotBlobs: [] };
  if (cfg.powerLevels) window.__state.pendingEntries.push({ type: 'm.room.power_levels', state_key: '', content: cfg.powerLevels });
  const mediaStore = new Map(); // mxc -> Uint8Array
  for (const seed of (cfg.seedMediaBlobs || [])) mediaStore.set(seed.mxc, new Uint8Array(seed.bytes));

  const iframe = document.getElementById('widget');
  const url = new URL('../../bridges/wigwag-matrix-host.html', location.href);
  url.searchParams.set('widgetId', cfg.widgetId);
  url.searchParams.set('matrix_room_id', cfg.roomId);
  url.searchParams.set('matrix_user_id', cfg.userId);
  url.searchParams.set('matrix_display_name', cfg.displayName);
  iframe.src = url.toString();

  function reply(msg, response) {
    iframe.contentWindow.postMessage(Object.assign({}, msg, { response }), '*');
  }

  // Mirrors two real toWidget requests Element sends once the iframe
  // finishes loading -- capabilities (which capability approval is
  // negotiated from) and supported_api_versions (a separate version
  // handshake) -- just enough to capture what the widget replies with.
  // This fixture doesn't otherwise gate anything on either, so this
  // exists purely so a test can assert what actually gets sent back.
  // Real regression coverage this protects: a required capability can go
  // missing from the requested list ("Unable to access room timeline"),
  // and answering supported_api_versions with {} instead of a real
  // supported_versions array makes Element's OWN handling of that reply
  // throw ("Cannot read properties of undefined (reading 'includes')")
  // -- both found live, neither would be caught without capturing these.
  function askWidget(action) {
    return new Promise((resolve) => {
      const requestId = 'widgetapi-' + Date.now() + '-' + Math.random().toString(36).slice(2);
      const onReply = (event) => {
        const msg = event.data;
        if (!msg || msg.widgetId !== cfg.widgetId || msg.requestId !== requestId || !('response' in msg)) return;
        window.removeEventListener('message', onReply);
        resolve(msg.response || {});
      };
      window.addEventListener('message', onReply);
      iframe.contentWindow.postMessage({ api: 'toWidget', widgetId: cfg.widgetId, requestId, action, data: {} }, '*');
    });
  }
  iframe.addEventListener('load', () => {
    askWidget('capabilities').then((response) => { window.__state.requestedCapabilities = response.capabilities || []; });
    askWidget('supported_api_versions').then((response) => { window.__state.supportedApiVersionsReply = response; });
  });

  // The bare "read_events" action doesn't exist in any real Widget API
  // driver -- confirmed live against real Element. Reading past timeline
  // events is MSC2876, unstabilized, namespaced accordingly; matches the
  // constant of the same name in wigwag-matrix-host.html itself.
  const READ_EVENTS_ACTION = 'org.matrix.msc2876.read_events';

  window.addEventListener('message', (event) => {
    const msg = event.data;
    if (!msg || typeof msg !== 'object' || msg.widgetId !== cfg.widgetId || msg.api !== 'fromWidget') return;
    const data = msg.data || {};
    if (msg.action === READ_EVENTS_ACTION && !(Array.isArray(data.room_ids) && data.room_ids[0] === cfg.roomId)) {
      // Confirmed live against real Element: omitting room_ids sends the
      // request down a "deprecated behaviour, no viewedRoomId" fallback
      // that throws inside Element's OWN ClientWidgetApi before ever
      // replying -- not a clean error, no reply at all. Simulating that
      // exact silent-drop here (rather than a tidy error response) is
      // what makes a regression here show up as the same timeout a real
      // user would hit, not a misleadingly clean rejection.
      return;
    }
    if (msg.action === 'content_loaded') {
      reply(msg, {});
    } else if (msg.action === READ_EVENTS_ACTION && data.type === 'm.room.name') {
      reply(msg, { events: cfg.roomName ? [{ type: 'm.room.name', content: { name: cfg.roomName } }] : [] });
    } else if (msg.action === READ_EVENTS_ACTION && data.type !== 'm.room.name' && dropReadEventsRemaining > 0) {
      // Simulates a request that gets NO reply at all (success or error) --
      // confirmed live: an earlier real connection attempt sat on
      // "Connecting..." for 20+ seconds with no resolution either way,
      // which postToHost's own per-request timeout now bounds.
      dropReadEventsRemaining--;
    } else if (msg.action === READ_EVENTS_ACTION && rejectReadEventsRemaining > 0) {
      // Simulates the real Element race this file's own retry logic exists
      // for: the widget's first read(s) can arrive before a just-approved
      // capability has actually taken effect on the host side.
      rejectReadEventsRemaining--;
      reply(msg, { error: { message: 'Cannot read room events of this type' } });
    } else if (msg.action === READ_EVENTS_ACTION) {
      // Deliberately returns the FULL current set every time rather than
      // draining a queue -- MSC2876 has no confirmed continuation-token
      // guarantee, so the real client dedupes by entry id itself instead
      // of trusting `since`/`nextToken`. Returning everything every call
      // is the worst case that dedupe has to handle; exercising it here
      // is the point, not an oversight.
      reply(msg, { events: window.__state.pendingEntries.slice(), nextToken: 'cursor-' + Date.now() });
    } else if (msg.action === 'send_event' && data.state_key !== undefined) {
      if (cfg.forbidStateEventType && data.type === cfg.forbidStateEventType) {
        reply(msg, { error: { message: 'insufficient power level' } });
        return;
      }
      window.__state.sentStateEvents.push({ type: data.type, state_key: data.state_key, content: data.content });
      // A real Matrix state event is also a timeline event at the position
      // it was sent -- reflected into pendingEntries so a subsequent
      // read_events call (this file's own getProjectIndex/pullMore) sees
      // it, same as a real room would.
      window.__state.pendingEntries.push({ type: data.type, state_key: data.state_key, content: data.content });
      reply(msg, { event_id: '$' + Math.random().toString(36).slice(2) });
    } else if (msg.action === 'org.matrix.msc4039.upload_file') {
      if (uploadRejectRemaining > 0) {
        uploadRejectRemaining--;
        reply(msg, { error: { message: 'file too large' } });
        return;
      }
      const bytes = data.file instanceof Uint8Array ? data.file : new Uint8Array(data.file);
      const mxc = 'mxc://example.org/media' + (window.__state.uploadedSnapshotBlobs.length + 1);
      mediaStore.set(mxc, bytes);
      window.__state.uploadedSnapshotBlobs.push({ mxc, bytes });
      reply(msg, { content_uri: mxc });
    } else if (msg.action === 'org.matrix.msc4039.download_file') {
      const bytes = mediaStore.get(data.content_uri);
      if (!bytes) { reply(msg, { error: { message: 'not found' } }); return; }
      // Confirmed live (tracker f6b39bf0): real Element replies with a
      // genuine Blob, not a raw Uint8Array/ArrayBuffer -- `new
      // Uint8Array(blob)` silently produces zero bytes (no numeric
      // `.length` the constructor can read), which this mock's own
      // previous Uint8Array reply could never have caught.
      reply(msg, { file: new Blob([bytes]) });
    } else if (msg.action === 'send_event') {
      window.__state.sentEntries.push(data.content);
      reply(msg, { event_id: '$' + Math.random().toString(36).slice(2) });
    } else {
      reply(msg, {}); // every toWidget-style request must be acked even when there's nothing to do
    }
  });
})();
</script>
</body>
</html>
