<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>wigwag — Matrix</title>
<!--
  wigwag-matrix-host.html -- a separate, non-bundled container that lets
  wigwag.html read/write its data through a Matrix room instead of (or
  alongside) localStorage+GitHub. See
  /home/dev/.claude/plans/encapsulated-waddling-gizmo.md ("Room Scoped
  Widget Mode") and tracker f6b39bf0 for the full design; short version:

  - Room Scoped Widget Mode's whole point (per Tom, tracker f6b39bf0/#153)
    is that decrypted room content never sits in a browser storage this
    client controls, outside the room's own protection lifecycle. An
    earlier version of this file relied on wigwag.html and this page
    sharing the SAME real browser localStorage (same-origin parent/iframe
    pairs share it natively) -- which meant every project this browser
    ever bridged sat in real, persistent, un-namespaced local storage.
    That's fixed now: wigwag.html holds an in-memory-only shim instead of
    ever touching real localStorage for content (see its own
    createRoomModeStorageShim), and this file does the same on its own
    side (see the `localStorage` shim right below) -- nothing durable on
    either end, ever. The two sides now talk over a small `postMessage`
    protocol instead of shared storage: the iframe sends `wigwag:hello`
    once at boot; this page answers `wigwag:hello-ack` with capabilities
    and a full snapshot of the three content keys
    (docKey(projectId)/PROJECTS_KEY/IDENTITIES_KEY); after that, a
    `wigwag:local-write` from the iframe is a local edit to push to
    Matrix, and a `wigwag:storage-changed` from this page is a remote (or
    another-tab) change to apply -- wigwag.html's own existing
    `_onStorageEvent` handles the latter completely unchanged, since the
    shim dispatches a real `StorageEvent` shaped exactly like the native
    cross-tab one it already knew how to handle.
  - This IS a small, deliberate addition to wigwag.html (the handshake
    protocol) -- it stays Matrix-agnostic (no Matrix-specific code, just
    "does a parent frame answer this handshake"), but the "wigwag.html
    doesn't need to know Matrix exists" framing from the original v1 design
    no longer means "wigwag.html has zero code for this at all."
  - Same-origin is no longer required for hosting this alongside
    wigwag.html -- `postMessage` works cross-origin. (The one exception is
    the widget-embedded transport's own separate protocol, which is
    cross-origin by nature already -- Element and the widget rarely share
    an origin.)
  - This file is NOT part of the bundled-artifact workflow docs/EDITING.md
    describes, and is NOT required to be offline-capable (it inherently
    needs network access to reach Matrix) -- so unlike wigwag.html it's
    free to load wigwag-core.js with a plain <script src>.

  Two transports, one shared bridge (createMatrixBridge below), NeoBoard-
  style: STANDALONE (Phase 2) talks to a homeserver directly with a
  personal access token, pasted into the form below. WIDGET (Phase 3)
  talks through the real Matrix Widget API postMessage protocol when
  embedded in a client like Element (`widgetId` present in
  location.search) -- no form at all in that mode: the room, the viewing
  user, and access are all already implied by being embedded, the same
  way Element auto-substitutes $matrix_room_id/$matrix_user_id/etc. into
  a widget's own URL before ever loading it.

  The widget-side protocol here is HAND-ROLLED, not the real
  @matrix-widget-toolkit/api package -- a deliberate choice (see the plan
  doc's own "open decision" on this): this environment can't verify a
  CDN-loaded library actually works without a real Element session to
  test against, whereas a small, self-contained implementation can be
  fully exercised by a fake-widget-host test page I control on both
  ends. It targets the documented MSC2762 message shapes as closely as
  I can without live verification -- flagged honestly in the plan as
  needing a real Element smoke test before being trusted, not something
  this file's own test suite can certify by itself.
-->
<script src="wigwag-core.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; margin: 0; height: 100vh; overflow: hidden; }
  #setup { max-width: 480px; margin: 60px auto; padding: 0 20px; }
  #setup h1 { font-size: 18px; margin-bottom: 4px; }
  #setup .sub { font-size: 13px; color: #6b7280; margin-bottom: 20px; line-height: 1.5; }
  #setup label { display: block; font-size: 12.5px; font-weight: 600; margin: 14px 0 4px; }
  #setup input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; font-family: inherit; }
  #setup button { margin-top: 18px; padding: 9px 16px; border: none; border-radius: 6px; background: #EF4755; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
  #setup button:disabled { opacity: 0.5; cursor: default; }
  /* Widget mode has nothing to prompt for (room/user/access are already
     implied by being embedded) but must still show #status -- it's a
     child of #setup, so hiding the whole div would silently swallow every
     connecting/error message a widget-mode user could otherwise see. */
  body.widget-mode #setup label, body.widget-mode #setup input, body.widget-mode #setup button { display: none; }
  #status { margin-top: 14px; font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; }
  #status.error { color: #b91c1c; }
  #status.ok { color: #15803d; }
  #frame { display: none; width: 100%; height: 100vh; border: none; }
</style>
</head>
<body>
  <div id="setup">
    <h1>wigwag — connect to a Matrix room</h1>
    <div class="sub">This project's data lives in the room's own timeline, not this browser's storage alone. Anyone with access to the room and their own token can open this same page and see the same tracker.</div>
    <label for="homeserverUrl">Homeserver URL</label>
    <input id="homeserverUrl" placeholder="https://matrix.example.org" autocomplete="off">
    <label for="accessToken">Access token</label>
    <input id="accessToken" type="password" placeholder="syt_..." autocomplete="off">
    <label for="roomId">Room ID or alias</label>
    <input id="roomId" placeholder="!abc123:example.org or #my-room:example.org" autocomplete="off">
    <button id="connectBtn">Connect</button>
    <div id="status"></div>
  </div>
  <iframe id="frame" src="about:blank"></iframe>

<script>
(function () {
  const core = window.WigwagCore;
  const $ = id => document.getElementById(id);
  const statusEl = $('status');
  const connectBtn = $('connectBtn');

  function setStatus(text, kind) {
    statusEl.textContent = text || '';
    statusEl.className = kind || '';
  }

  // A room id has no inherent relationship to a wigwag project id (the
  // Matrix event shape doesn't carry one yet -- a deliberate v1 gap, see
  // the plan doc). Deriving it deterministically from the room id means
  // reconnecting to the same room always resolves to the same local
  // project, with no separate persisted room->project mapping needed.
  //
  // REVERTED (tracker #149, confirmed live): a SHA-256-based version of
  // this shipped briefly to close a theoretical room-id collision risk,
  // but this id isn't just an internal detail -- it's the actual
  // localStorage key a browser stores its copy of "the project for this
  // room" under. Changing the ALGORITHM meant every browser that
  // reconnected after picking up that change derived a DIFFERENT id for
  // the exact same room than it had before, and since that new id had no
  // existing local doc, bootstrapLocalStorage treated it as a genuinely
  // new project and seeded a second, parallel one from the room's
  // current timeline -- without touching or removing the original. Real
  // damage, confirmed live: two users ended up on two different local
  // projects for the same room, each showing a different, seemingly
  // "not synced" slice of the same underlying data. The room's own
  // shared timeline was never affected -- this was purely a local-
  // derivation mismatch -- but it's a hard lesson: this value is
  // effectively part of the persisted format, not free to change without
  // a real migration path. Back to the original weak-but-stable hash
  // until a migration (detect + adopt the old-scheme id) is designed
  // properly, not shipped as a "safe" one-line improvement again.
  function deriveProjectId(roomId) {
    const hash = Array.from(roomId).reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 0);
    return 'matrix-' + hash.toString(16).padStart(8, '0');
  }

  function docKey(projectId) { return core.STORAGE_KEY + ':' + projectId; }

  // --- In-memory storage shim (Room Scoped Widget Mode) -------------------
  // Every function below (readCurrentLocalDoc, bootstrapLocalStorage,
  // adoptLocalProjects, reconcileIntoLocal, ...) was written assuming
  // ordinary synchronous localStorage semantics, back when this page and
  // wigwag.html shared the SAME real browser localStorage (same-origin
  // parent/iframe pairs share it natively). That's exactly the thing Tom
  // objected to (tracker f6b39bf0/#153) -- decrypted room content sitting
  // in a real, persistent, client-controlled store. Fix: shadow the bare
  // `localStorage` identifier used everywhere below with this in-memory
  // shim instead, so none of those functions need to change at all. No
  // namespacing needed here either (unlike the now-superseded
  // storageNamespacePrefix approach) -- each bridge instance/room
  // connection gets its own separate shim in its own separate page, so
  // there's no shared bucket for two rooms' content to collide in.
  let localStorage = (() => {
    const mem = new Map();
    let frame = null;
    function notifyFrame(key, newValue) {
      if (frame && frame.contentWindow) frame.contentWindow.postMessage({ type: 'wigwag:storage-changed', key, newValue }, '*');
    }
    return {
      attachFrame(f) { frame = f; },
      // General-purpose escape hatch alongside notifyFrame's own
      // storage-changed-specific messaging -- used for the moderator-gate
      // rejection notice (createMatrixBridge's adoptOneLocalProject),
      // which is not itself a storage-key change.
      postMessageToFrame(msg) { if (frame && frame.contentWindow) frame.contentWindow.postMessage(msg, '*'); },
      getItem(key) { return mem.has(key) ? mem.get(key) : null; },
      setItem(key, value) { mem.set(key, value); notifyFrame(key, value); },
      removeItem(key) { mem.delete(key); notifyFrame(key, null); },
      // Applies a write that originated FROM the iframe itself (a
      // wigwag:local-write message) -- updates this page's own copy, same
      // as any other setItem, but does NOT echo wigwag:storage-changed
      // back to the iframe that just sent it (a harmless but pointless
      // round-trip otherwise).
      applyFromFrame(key, value) { if (value === null || value === undefined) mem.delete(key); else mem.set(key, value); },
      // The full current snapshot, handed to the iframe once as part of
      // wigwag:hello-ack -- by the time a real connection's iframe sends
      // wigwag:hello, openAll() below has already fully populated this.
      dumpAll() { return Object.fromEntries(mem); }
    };
  })();
  // Test-only introspection hook -- this content lives only in the two
  // in-memory shims (this one and wigwag.html's own) now, nowhere a test
  // could otherwise observe it (real localStorage, on either side of the
  // frame boundary, deliberately never holds it -- see above). Read-only
  // and harmless in production: it exposes nothing a real client
  // couldn't already see by watching the postMessage traffic itself.
  window.__wigwagHostStorage = localStorage;

  // Identity generation (Matrix-originated: label = display name,
  // email = MXID, see wigwag.html's own resolveRoomModeIdentity for the
  // full rationale) now happens on wigwag.html's side, since the signing
  // keypair is a device credential that lives in the iframe's own real
  // localStorage -- this page has no access to it and no reason to.

  // ----- Transports -----------------------------------------------------
  // Both expose the same small interface: probeAccess/pullInitial/pullMore
  // /send/getRoomName/whoAmI. The bridge below (createMatrixBridge) is
  // written entirely against this interface and has no idea which
  // transport is actually running underneath -- the NeoBoard pattern Tom
  // pointed at directly.

  // Standalone (Phase 2): a personal access token, direct Client-Server
  // API calls via the wigwag-core.js helpers built in Phase 1.
  function createDirectTransport({ homeserverUrl, accessToken, roomId }) {
    let syncCursor = null;
    return {
      async probeAccess() {
        return core.probeMatrixRoomAccess({ fetchImpl: fetch, homeserverUrl, accessToken, roomId });
      },
      // Loops backward through the room's FULL history rather than
      // returning after one page -- live-reported (Tom, tracker f6b39bf0):
      // a single-page pull meant discoverProjects() only ever saw whatever
      // fit in one page of the most RECENT events, so a room whose older
      // history held a different project than a just-pushed bulk import
      // would show only the new one (and, if the import's own name entry
      // happened to sit further back than one page reached, no name for
      // it either) until the slow 5s poll eventually happened to catch up
      // -- a real correctness bug, not just a slow load. Standard Matrix
      // `/messages` pagination (`dir`+`from`+`end`) is a reliable,
      // documented mechanism (unlike the widget transport's `read_events`
      // continuation token -- see PAGE_LIMIT below, and this file's own
      // fake-widget-host.html comment on why that one can't loop the same
      // way), so this can safely loop to genuine exhaustion: stop once a
      // page comes back empty (reached the start of the room), or once a
      // page fails outright (return whatever was already accumulated
      // rather than discarding real progress over one flaky request).
      async pullInitial() {
        const PAGE_LIMIT = 500;
        const MAX_PAGES = 50; // ~25k events -- a sanity cap, not expected to bind in practice
        let allEvents = [];
        let cursor = undefined;
        for (let page = 0; page < MAX_PAGES; page++) {
          const result = await core.fetchMatrixRoomEntries({ fetchImpl: fetch, homeserverUrl, accessToken, roomId, from: cursor, dir: 'b', limit: PAGE_LIMIT });
          if (result.status !== 'ok') return page === 0 ? result : { status: 'ok', events: allEvents, end: cursor };
          allEvents = allEvents.concat(result.events);
          if (!result.events.length || !result.end) { cursor = result.end; break; }
          cursor = result.end;
        }
        syncCursor = cursor;
        return { status: 'ok', events: allEvents, end: cursor };
      },
      async pullMore() {
        const result = await core.fetchMatrixRoomEntries({ fetchImpl: fetch, homeserverUrl, accessToken, roomId, from: syncCursor || undefined, dir: 'f' });
        if (result.status === 'ok') syncCursor = result.end;
        return result;
      },
      async send(content) {
        const txnId = 'wigwag-' + Date.now() + '-' + Math.random().toString(36).slice(2);
        return core.sendMatrixEntry({ fetchImpl: fetch, homeserverUrl, accessToken, roomId, content, txnId });
      },
      async sendBatch(items) {
        const txnId = 'wigwag-batch-' + Date.now() + '-' + Math.random().toString(36).slice(2);
        return core.sendMatrixEntries({ fetchImpl: fetch, homeserverUrl, accessToken, roomId, content: core.matrixEventContentFromEntries(items), txnId });
      },
      // Media-blob snapshot (tracker f6b39bf0's rate-limit fix, replacing
      // the old chunk-event set) -- one upload, real access token, plain
      // fetch. See core.uploadMatrixMedia's own comment for the endpoint
      // choice (upload stays on /_matrix/media/v3/upload; only
      // download/config moved under MSC3916).
      async uploadSnapshotBlob(bytes) {
        return core.uploadMatrixMedia({ fetchImpl: fetch, homeserverUrl, accessToken, bytes });
      },
      async downloadSnapshotBlob(mxc) {
        return core.downloadMatrixMedia({ fetchImpl: fetch, homeserverUrl, accessToken, mxc });
      },
      async sendSnapshotManifest(manifestContent) {
        const txnId = 'wigwag-snapshot-' + manifestContent.snapshotId;
        return core.sendMatrixSnapshotManifest({ fetchImpl: fetch, homeserverUrl, accessToken, roomId, content: manifestContent, txnId });
      },
      async getRoomName() {
        try {
          const res = await fetch(homeserverUrl.replace(/\/$/, '') + '/_matrix/client/v3/rooms/' + encodeURIComponent(roomId) + '/state/m.room.name', { headers: { Authorization: 'Bearer ' + accessToken } });
          if (!res.ok) return null;
          const data = await res.json();
          return data.name || null;
        } catch (e) { return null; }
      },
      // Moderator-gated (tracker f6b39bf0, live-reported rate-limit
      // incident, Tom's explicit call): a state write, so Matrix's own
      // power-level check (state_default, typically 50) enforces this --
      // nothing client-side to bypass or rely on. A 'forbidden' result is
      // the real, correct outcome for a non-moderator, not an error to
      // paper over.
      async createProject(projectId) {
        const content = core.matrixStateEventContentFromProjectCreation({ createdAt: new Date().toISOString(), createdBy: await this.whoAmI() });
        return core.sendMatrixProjectStateEvent({ fetchImpl: fetch, homeserverUrl, accessToken, roomId, projectId, content });
      },
      // Current-state fetch -- always complete and instant, unlike
      // scanning the timeline, which is what makes this the reliable way
      // to discover every project at connect time (see
      // WIGWAG_MATRIX_PROJECT_STATE_TYPE's own comment in wigwag-core.js).
      async getProjectIndex() {
        const result = await core.getMatrixRoomState({ fetchImpl: fetch, homeserverUrl, accessToken, roomId });
        if (result.status !== 'ok') return result;
        const projectIds = result.events.map(core.projectIdFromMatrixStateEvent).filter(Boolean);
        return { status: 'ok', projectIds };
      },
      // A signed wigwag entry needs a non-empty identityEmail before
      // wigwag.html will commit it at all (requireIdentityEmail gates
      // every write behind an "enter your email" modal otherwise --
      // correct behavior, not something to bypass). There's no real
      // email to offer here, so the Matrix account's own user id (from
      // /account/whoami) stands in for it -- not a literal email
      // address, but a real, stable, human-meaningful "who made this
      // edit" value, which is all identityEmail is actually used for.
      async whoAmI() {
        try {
          const res = await fetch(homeserverUrl.replace(/\/$/, '') + '/_matrix/client/v3/account/whoami', { headers: { Authorization: 'Bearer ' + accessToken } });
          if (!res.ok) return null;
          const data = await res.json();
          return data.user_id || null;
        } catch (e) { return null; }
      }
    };
  }

  // Widget-embedded (Phase 3): the real Matrix Widget API, hand-rolled --
  // see the module comment above for why. A small postMessage
  // request/response protocol (MSC2762): the widget sends {api:
  // 'fromWidget', requestId, action, data} to window.parent, the host
  // replies with the SAME message plus a `response` field; the host can
  // also unprompted-send {api: 'toWidget', ...} messages the widget must
  // always ack (even ones it doesn't understand -- an unacknowledged
  // toWidget request can hang the host waiting for a response it'll
  // never get).
  //
  // Capabilities are requested once, upfront, when the host asks for
  // them -- they cannot be added after that handshake, so every
  // capability this file will ever need has to be declared here, not
  // discovered lazily.
  const WIDGET_EVENT_TYPE = core.WIGWAG_MATRIX_ENTRY_TYPE;
  // Bulk-transport optimization (tracker #149) -- see
  // matrixEventContentFromEntries in wigwag-core.js. Needs its own
  // receive/send capability grant below, same as the single-entry type --
  // Element gates read/send per event type, not per "wigwag in general".
  const WIDGET_ENTRIES_TYPE = core.WIGWAG_MATRIX_ENTRIES_TYPE;
  // Room snapshot (tracker f6b39bf0/#153, f1c7098f/#154) -- see
  // WIGWAG_MATRIX_SNAPSHOT_TYPE's own comment in wigwag-core.js. Just the
  // one small manifest event now (media-blob snapshots, not chunking) --
  // same "needs its own receive/send capability" treatment as any other
  // event type.
  const WIDGET_SNAPSHOT_TYPE = core.WIGWAG_MATRIX_SNAPSHOT_TYPE;
  // Project index (tracker f6b39bf0, live-reported rate-limit incident) --
  // a STATE event type, needs send.state_event/receive.state_event
  // capabilities below, not the send.event/receive.event pair the other
  // types use.
  const WIDGET_PROJECT_STATE_TYPE = core.WIGWAG_MATRIX_PROJECT_STATE_TYPE;
  // The bare "read_events" action name doesn't exist in any shipped Widget
  // API driver -- confirmed live against real Element ("Unknown or
  // unsupported from-widget action: read_events"). Reading past timeline
  // events is MSC2876, unstabilized, and namespaced accordingly.
  const READ_EVENTS_ACTION = 'org.matrix.msc2876.read_events';
  // The exact set the real matrix-widget-api library itself declares
  // (interfaces/ApiVersion.ts's CurrentApiVersions) -- matching it exactly
  // rather than trimming to only what this file actually uses, since
  // Element's own host code was written and tested against widgets
  // returning this specific list and an untested subset risks tripping
  // some other unverifiable assumption the same way answering this
  // request with {} did.
  const SUPPORTED_API_VERSIONS = [
    '0.0.1', '0.0.2',
    'org.matrix.msc2762', 'org.matrix.msc2762_update_state', 'org.matrix.msc2871', 'org.matrix.msc2873',
    'org.matrix.msc2931', 'org.matrix.msc2974', 'org.matrix.msc2876', 'org.matrix.msc3819',
    'town.robin.msc3846', 'org.matrix.msc3869', 'org.matrix.msc3973', 'org.matrix.msc4039',
    'org.matrix.msc4515', 'org.matrix.msc4533'
  ];

  function getWidgetContext() {
    const params = new URLSearchParams(location.search);
    const widgetId = params.get('widgetId');
    if (!widgetId || window.parent === window) return null;
    // Element (and any Widget-API-spec-following client) substitutes
    // these template variables into the widget's own registered URL
    // before ever loading it -- no round-trip needed to learn who's
    // viewing or which room this is, unlike the standalone form.
    return {
      widgetId,
      roomId: params.get('matrix_room_id') || params.get('roomId'),
      userId: params.get('matrix_user_id') || params.get('userId'),
      displayName: params.get('matrix_display_name') || params.get('displayName')
    };
  }

  function createWidgetTransport({ widgetId, roomId }) {
    let seq = 0;
    const pending = new Map(); // requestId -> {resolve, reject}
    // A THIRD, separate capability gates read_events entirely, on top of
    // the per-event-type receive/send ones above -- confirmed live:
    // requesting only receive/send.event still got "Unable to access room
    // timeline" from canUseRoomTimeline(), which checks this specific
    // capability instead. Scoped to this one room (not the AnyRoom
    // wildcard) since a widget instance only ever has one.
    const WIDGET_CAPABILITIES = [
      'org.matrix.msc2762.receive.event:' + WIDGET_EVENT_TYPE,
      'org.matrix.msc2762.send.event:' + WIDGET_EVENT_TYPE,
      'org.matrix.msc2762.receive.event:' + WIDGET_ENTRIES_TYPE,
      'org.matrix.msc2762.send.event:' + WIDGET_ENTRIES_TYPE,
      'org.matrix.msc2762.receive.event:' + WIDGET_SNAPSHOT_TYPE,
      'org.matrix.msc2762.send.event:' + WIDGET_SNAPSHOT_TYPE,
      'org.matrix.msc2762.receive.state_event:' + WIDGET_PROJECT_STATE_TYPE,
      'org.matrix.msc2762.send.state_event:' + WIDGET_PROJECT_STATE_TYPE,
      'org.matrix.msc2762.timeline:' + roomId,
      // MSC4039 ("Access the Content repository with the Widget API") --
      // media-blob snapshots (tracker f6b39bf0's rate-limit fix) need the
      // widget transport to reach the media repo too, not just the direct
      // transport's plain fetch. Still unstable/unmerged as of this
      // writing (confirmed implemented in matrix-widget-api since v1.9.0
      // and in Element's react-sdk), hence the namespaced prefix on both
      // the capability strings here and the action names below.
      'org.matrix.msc4039.upload_file',
      'org.matrix.msc4039.download_file'
    ];

    function nextRequestId() { return 'wigwag-' + Date.now() + '-' + (seq++); }
    // A request that never gets ANY reply (success or error) must not hang
    // this file forever -- confirmed live: a real connection attempt sat
    // on "Connecting..." for 20+ seconds with no resolution either way.
    // 8s is generous for a same-postMessage-bus round trip; past that,
    // fail loudly with a diagnosable message instead of hanging silently.
    const REPLY_TIMEOUT_MS = 8000;
    function postToHost(action, data) {
      return new Promise((resolve, reject) => {
        const requestId = nextRequestId();
        const timer = setTimeout(() => {
          if (!pending.has(requestId)) return;
          pending.delete(requestId);
          reject(new Error('no reply from host within ' + REPLY_TIMEOUT_MS + 'ms for action "' + action + '"'));
        }, REPLY_TIMEOUT_MS);
        pending.set(requestId, {
          resolve: (v) => { clearTimeout(timer); resolve(v); },
          reject: (e) => { clearTimeout(timer); reject(e); }
        });
        console.log('[wigwag-widget] -> fromWidget', action, requestId, data);
        window.parent.postMessage({ api: 'fromWidget', widgetId, requestId, action, data: data || {} }, '*');
      });
    }

    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg || typeof msg !== 'object') return;
      if (msg.widgetId !== widgetId) {
        if (msg.api === 'fromWidget' || msg.api === 'toWidget') console.log('[wigwag-widget] <- ignored (widgetId mismatch)', msg.widgetId, 'expected', widgetId, msg);
        return;
      }
      console.log('[wigwag-widget] <-', msg.api, msg.action, msg.requestId, msg);
      if (msg.api === 'fromWidget' && 'response' in msg && pending.has(msg.requestId)) {
        const { resolve, reject } = pending.get(msg.requestId);
        pending.delete(msg.requestId);
        if (msg.response && msg.response.error) reject(new Error(msg.response.error.message || 'widget API error'));
        else resolve(msg.response);
        return;
      }
      // Any toWidget request must be acked, even ones with no meaningful
      // work to do here -- an unanswered one can hang the host. 'capabilities'
      // and 'supported_api_versions' are the two we actually answer for
      // real; everything else (e.g. a live-pushed event notification we
      // don't otherwise act on, since polling via read_events is this
      // file's only sync path for both transports) just gets acked empty.
      //
      // supported_api_versions matters more than it looks: confirmed live
      // that answering it with an empty {} (as if it were just another
      // ignorable notification) makes Element's OWN handling of that
      // reply throw ("Cannot read properties of undefined (reading
      // 'includes')" in ClientWidgetApi.ts) -- it reads
      // response.supported_versions.includes(...) unconditionally, with
      // no guard for a widget that didn't declare any. That throw happens
      // to land in the same message-dispatch path that would otherwise
      // deliver replies to THIS widget's own pending requests, so every
      // read_events call after the first quietly stopped getting any
      // reply at all -- not a read_events bug specifically, a version-
      // negotiation one with knock-on effects on everything else.
      if (msg.api === 'toWidget') {
        let response = {};
        if (msg.action === 'capabilities') response = { capabilities: WIDGET_CAPABILITIES };
        else if (msg.action === 'supported_api_versions') response = { supported_versions: SUPPORTED_API_VERSIONS };
        window.parent.postMessage(Object.assign({}, msg, { response }), '*');
      }
    });

    let readCursor = undefined; // passed as a hint if the host supports pagination; harmless if it doesn't
    // MSC2876 has no confirmed continuation-token guarantee across real
    // hosts -- rather than trust `since`/`nextToken` round-tripping
    // correctly, dedupe on the entry's own id so a host that just replays
    // the full matching set on every call still only ever yields genuinely
    // new events here, exactly as if pagination worked.
    const seenRawEventIds = new Set();
    function dedupeNew(events) {
      const fresh = [];
      for (const ev of events) {
        const entryId = ev && ev.content && ev.content.entry && ev.content.entry.id;
        const key = entryId || JSON.stringify(ev);
        if (seenRawEventIds.has(key)) continue;
        seenRawEventIds.add(key);
        fresh.push(ev);
      }
      return fresh;
    }
    return {
      async probeAccess() {
        // Being embedded in the room at all implies read access already
        // -- there is no separate "is this token valid for this room"
        // question the way a pasted personal token has for the direct
        // transport.
        return { status: 'can-read-write' };
      },
      async pullInitial() {
        // No explicit content_loaded here: a widget registered without
        // `waitForIframeLoad: false` in its data (the default) has the
        // host treat the iframe's own native `load` event as the ready
        // signal already, and will reject a widget that ALSO sends
        // content_loaded itself ("Improper sequence: not expecting
        // ContentLoaded event if waitForIframeLoad is true") -- confirmed
        // live against real Element. Simplest fix: don't send it: nothing
        // here needs finer control over the ready-timing than "iframe
        // loaded" already gives for free.
        //
        // But that same iframe `load` event is also what the host uses to
        // KICK OFF capability negotiation -- which then waits on a real
        // user-facing approval dialog before the requested capabilities
        // actually take effect. This code runs on that same load, with no
        // signal telling it approval has actually landed yet, so the very
        // first read can legitimately race a human clicking through that
        // dialog -- confirmed live: a real approval was granted and the
        // first attempt still failed with "Cannot read room events of
        // this type", and separately, a request has also been observed to
        // get NO reply at all for 20+ seconds (now bounded by postToHost's
        // own per-request timeout above, surfacing as a "no reply..."
        // error instead of hanging forever). Retry on ANY error here, not
        // just the one specific message seen so far -- this early in a
        // widget's life, an error is more likely transient
        // negotiation-related noise than a permanent condition, and the
        // later 5s poll would silently recover from a real transient issue
        // anyway; this just avoids a false "could not connect" report on
        // the very first attempt.
        const RETRY_DELAYS_MS = [500, 1000, 1500, 2000, 2000, 2000, 2000];
        for (let attempt = 0; ; attempt++) {
          const result = await this.pullMore();
          if (result.status === 'ok' || attempt >= RETRY_DELAYS_MS.length) return result;
          await new Promise(resolve => setTimeout(resolve, RETRY_DELAYS_MS[attempt]));
        }
      },
      async pullMore() {
        try {
          // room_ids is REQUIRED, not optional, despite the spec/library
          // marking it that way -- confirmed live: omitting it (so
          // Element falls back to its own "deprecated behaviour, no
          // viewedRoomId set" code path, which the driver itself
          // console.warns about) throws inside Element's OWN
          // ClientWidgetApi before it ever replies, silently killing every
          // read_events request rather than answering with an error.
          // Naming this room explicitly steers Element to its other,
          // apparently-working code path instead.
          //
          // WIDGET_PAGE_LIMIT is a mitigation, not a complete fix, for the
          // same live-reported problem createDirectTransport's pullInitial
          // solves properly (see its own comment): unlike the direct
          // transport's standard, documented Matrix `/messages` pagination,
          // MSC2876's `read_events` continuation token has no confirmed
          // guarantee of eventually returning an empty/exhausted result
          // (see fake-widget-host.html's own comment on why this file
          // dedupes by entry id instead of trusting `since`) -- looping on
          // it the same way risks a worse bug (a loop that never
          // terminates) than the one being fixed. A much larger single-call
          // limit shrinks the piecemeal-loading window in practice without
          // that risk, but doesn't guarantee full-history completeness the
          // way the direct transport now does. Closing that gap for real
          // needs a room snapshot mechanism (tracker f1c7098f), not a
          // bigger number here.
          const WIDGET_PAGE_LIMIT = 2000;
          const result = await postToHost(READ_EVENTS_ACTION, { type: WIDGET_EVENT_TYPE, room_ids: [roomId], limit: WIDGET_PAGE_LIMIT, since: readCursor });
          const events = ((result && result.events) || []).slice();
          if (result && result.nextToken) readCursor = result.nextToken;
          // Batch (bulk-transport) events are a separate event type --
          // read_events filters by exactly one `type` per call (confirmed
          // by the primary call above, no evidence an array is accepted),
          // so this is a second, independent read. Best-effort: a host
          // that hasn't granted the newer batch capability (or briefly
          // errors) must never break ordinary single-entry sync, which is
          // why this failure is swallowed rather than propagated.
          try {
            const batchResult = await postToHost(READ_EVENTS_ACTION, { type: WIDGET_ENTRIES_TYPE, room_ids: [roomId], limit: WIDGET_PAGE_LIMIT, since: readCursor });
            events.push(...((batchResult && batchResult.events) || []));
            if (batchResult && batchResult.nextToken) readCursor = batchResult.nextToken;
          } catch (e) { console.warn('[wigwag-matrix-host] batch read_events failed (non-fatal):', e.message); }
          // Snapshot manifest events -- same best-effort treatment: a host
          // that hasn't granted this newer capability yet must never break
          // ordinary sync. Just the one small event now (media-blob
          // snapshots, not chunking) -- no separate chunk-type read.
          try {
            const snapResult = await postToHost(READ_EVENTS_ACTION, { type: WIDGET_SNAPSHOT_TYPE, room_ids: [roomId], limit: WIDGET_PAGE_LIMIT, since: readCursor });
            events.push(...((snapResult && snapResult.events) || []));
          } catch (e) { console.warn('[wigwag-matrix-host] snapshot read_events failed (non-fatal):', e.message); }
          // A project created by a moderator WHILE this session is already
          // connected rides this same live poll -- same best-effort
          // treatment as the other types above.
          try {
            const projectResult = await postToHost(READ_EVENTS_ACTION, { type: WIDGET_PROJECT_STATE_TYPE, room_ids: [roomId], limit: WIDGET_PAGE_LIMIT, since: readCursor });
            events.push(...((projectResult && projectResult.events) || []));
          } catch (e) { console.warn('[wigwag-matrix-host] project-index read_events failed (non-fatal):', e.message); }
          return { status: 'ok', events: dedupeNew(events) };
        } catch (e) {
          return { status: 'error', message: e.message };
        }
      },
      async send(content) {
        try {
          await postToHost('send_event', { type: WIDGET_EVENT_TYPE, content });
          return { status: 'ok' };
        } catch (e) {
          return { status: 'error', message: e.message };
        }
      },
      async sendBatch(items) {
        try {
          await postToHost('send_event', { type: WIDGET_ENTRIES_TYPE, content: core.matrixEventContentFromEntries(items) });
          return { status: 'ok' };
        } catch (e) {
          return { status: 'error', message: e.message };
        }
      },
      // MSC4039 ("Access the Content repository with the Widget API") --
      // exact request/response shapes confirmed against the proposal
      // text: data.file / response.file are a raw XMLHttpRequestBodyInit
      // (a Uint8Array/ArrayBuffer, structured-clonable through postMessage
      // directly), never base64. Still unstable/unmerged; the exact wire
      // behavior against a REAL Element build is worth a manual smoke test
      // before relying on this live, same caveat as this file's other
      // MSC-prefixed actions.
      async uploadSnapshotBlob(bytes) {
        try {
          const result = await postToHost('org.matrix.msc4039.upload_file', { file: bytes });
          if (!result || !result.content_uri) return { status: 'error', message: 'upload_file returned no content_uri' };
          return { status: 'ok', mxc: result.content_uri };
        } catch (e) {
          return { status: 'error', message: e.message };
        }
      },
      async downloadSnapshotBlob(mxc) {
        try {
          const result = await postToHost('org.matrix.msc4039.download_file', { content_uri: mxc });
          if (!result || !result.file) return { status: 'error', message: 'download_file returned no file' };
          const bytes = result.file instanceof Uint8Array ? result.file : new Uint8Array(result.file);
          return { status: 'ok', bytes };
        } catch (e) {
          return { status: 'error', message: e.message };
        }
      },
      async sendSnapshotManifest(manifestContent) {
        try {
          await postToHost('send_event', { type: WIDGET_SNAPSHOT_TYPE, content: manifestContent });
          return { status: 'ok' };
        } catch (e) {
          return { status: 'error', message: e.message };
        }
      },
      async getRoomName() {
        try {
          const result = await postToHost(READ_EVENTS_ACTION, { type: 'm.room.name', room_ids: [roomId], state_key: '', limit: 1 });
          const events = (result && result.events) || [];
          const last = events[events.length - 1];
          return (last && last.content && last.content.name) || null;
        } catch (e) { return null; } // best-effort -- falls back to the placeholder name, same as the direct transport
      },
      // Moderator-gated (see WIGWAG_MATRIX_PROJECT_STATE_TYPE's own comment
      // in wigwag-core.js) -- a state send via send_event needs a
      // `state_key` alongside type/content, same shape the real
      // matrix-widget-api client library uses for its own
      // sendStateEvent(). A 'forbidden'-shaped rejection here is Element
      // surfacing the SAME real power-level check the direct transport's
      // homeserver PUT would -- not a widget-specific restriction.
      async createProject(projectId) {
        try {
          await postToHost('send_event', { type: WIDGET_PROJECT_STATE_TYPE, state_key: projectId, content: core.matrixStateEventContentFromProjectCreation({ createdAt: new Date().toISOString(), createdBy: null }) });
          return { status: 'ok' };
        } catch (e) {
          // Element reports a capability/power-level rejection as a
          // rejected promise (postToHost's own error path above), not a
          // distinct status -- there is no separate 403 to inspect here
          // the way the direct transport's raw fetch has. Treat any
          // failure as 'forbidden' for the caller's purposes: either
          // reading is genuinely correct (no power level), or it's some
          // other transient widget-API error -- both should surface as
          // "this didn't work," never silently look like success.
          return { status: 'forbidden', message: e.message };
        }
      },
      // Same read_events mechanism as every other type this transport
      // reads (getRoomName above included) -- NOT the direct transport's
      // real always-current getMatrixRoomState. There is no confirmed
      // "give me current state regardless of history depth" primitive on
      // the widget API as used elsewhere in this file, so this inherits
      // the same depth-limited caveat pullMore's own comment already
      // documents for ordinary entries: a real fix (if this ever proves
      // insufficient live) needs verifying against a real Element build,
      // not assumed here. Multiple state_keys under one type -- unlike
      // getRoomName's single fixed '' key -- so no state_key filter is
      // passed; the latest occurrence per state_key (by arrival order)
      // is taken as current.
      async getProjectIndex() {
        try {
          const result = await postToHost(READ_EVENTS_ACTION, { type: WIDGET_PROJECT_STATE_TYPE, room_ids: [roomId], limit: 2000 });
          const events = (result && result.events) || [];
          const projectIds = new Set();
          for (const ev of events) {
            const id = core.projectIdFromMatrixStateEvent(ev);
            if (id) projectIds.add(id);
          }
          return { status: 'ok', projectIds: [...projectIds] };
        } catch (e) {
          return { status: 'error', message: e.message };
        }
      },
      async whoAmI(fallbackUserId) { return fallbackUserId || null; } // already known from the widget URL, no round-trip needed
    };
  }

  // ----- Shared bridge (transport-agnostic) ------------------------------

  function docStorable(hydrated, hiddenFieldIds) {
    // Strips values/fieldRefs before persisting -- these are never
    // stored, only ever derived fresh (docs/FORMAT.md's "History is the
    // sole source of truth"), matching wigwag.html's own persist().
    return {
      fieldDefs: hydrated.fieldDefs,
      projectHistory: hydrated.projectHistory,
      issues: hydrated.issues.map(({ values, fieldRefs, ...rest }) => rest),
      hiddenFieldIds: hiddenFieldIds || []
    };
  }

  function readCurrentLocalDoc(projectId) {
    const raw = localStorage.getItem(docKey(projectId));
    const doc = raw ? JSON.parse(raw) : { fieldDefs: core.defaultFieldDefs(), projectHistory: [], issues: [], hiddenFieldIds: [] };
    const hydratedProject = core.hydrateProject(doc.fieldDefs, doc.projectHistory || []);
    const hydratedIssues = (doc.issues || []).map(iss => core.hydrateIssue(iss, hydratedProject.fieldDefs));
    return { hiddenFieldIds: doc.hiddenFieldIds || [], fieldDefs: hydratedProject.fieldDefs, projectHistory: hydratedProject.projectHistory, issues: hydratedIssues };
  }

  // Flattens a hydrated doc's history/comment-stream entries back into
  // the same {scope, issueId, stream, entry} shape entryFromMatrixEvent
  // produces, so a single "have we sent/seen this entry id" Set can track
  // both directions uniformly.
  function flattenEntries(hydrated) {
    const out = hydrated.projectHistory.map(entry => ({ scope: 'project', issueId: null, stream: null, entry }));
    for (const iss of hydrated.issues) {
      for (const entry of (iss.history || [])) out.push({ scope: 'issue', issueId: iss.id, stream: null, entry });
      for (const stream in (iss.commentStreams || {})) {
        for (const entry of iss.commentStreams[stream]) out.push({ scope: 'issue', issueId: iss.id, stream, entry });
      }
    }
    return out;
  }

  // Tracker #149: a room can hold more than one project's history (an
  // imported project keeps its own id rather than getting mangled into
  // "the" room's one project -- see docs/FORMAT.md's "Matrix room
  // backing" section). Discovery is deliberately the simplest thing that
  // could work for now: scan whatever's already been pulled for distinct
  // projectId values, no separate discovery event/capability needed. An
  // untagged entry (the shape every entry had before projectId existed)
  // always counts as evidence of the room's own legacy/default project,
  // never a project of its own.
  //
  // Names for anything other than the legacy default are a real, known
  // gap: a project's own name has only ever been local, per-browser
  // metadata (PROJECTS_KEY.milestones[].name), never part of the shared
  // signed history -- so a project discovered purely from the timeline,
  // that this browser has never locally seen before, has no shared name
  // to show yet. Falls back to a short id-based label until project
  // naming is itself shared (a real project-scope history entry, not
  // solved here).
  // indexedProjectIds (tracker f6b39bf0, live-reported rate-limit
  // incident): the reliable, always-current set of project ids from a
  // real current-state read (createMatrixBridge's own connect(), via
  // transport.getProjectIndex()) -- immune to how much unrelated room
  // traffic sits between "now" and when a project was created, unlike
  // scanning a timeline that might have to reach arbitrarily far back.
  // Omitted (or empty) on ongoing/live calls (the bridgeTimer poll loop
  // below), which instead rely on this function's own timeline scan
  // picking up dev.wigwag.project occurrences as they arrive naturally in
  // the poll -- see that event type's own comment in wigwag-core.js.
  function discoverProjects(rawEvents, legacyDefaultProjectId, legacyDefaultProjectName, indexedProjectIds) {
    const ids = new Set(indexedProjectIds || []);
    let sawUntagged = false;
    // Bucket project-scope entries by the project they belong to (an
    // untagged entry belongs to the legacy default project, same rule
    // hydrateProjectFromMatrixTimeline's includeUntaggedEntries default
    // uses), so each discovered project's label can prefer its own real
    // derived name (tracker #149) over a generic placeholder.
    const projectScopeEntriesById = new Map();
    for (const rawEvent of rawEvents) {
      if (rawEvent && rawEvent.type === core.WIGWAG_MATRIX_PROJECT_STATE_TYPE) {
        const id = core.projectIdFromMatrixStateEvent(rawEvent);
        if (id) ids.add(id);
        continue;
      }
      const decodedItems = (rawEvent && rawEvent.type === core.WIGWAG_MATRIX_ENTRIES_TYPE)
        ? core.entriesFromMatrixEvent(rawEvent)
        : [core.entryFromMatrixEvent(rawEvent)].filter(Boolean);
      for (const decoded of decodedItems) {
      if (decoded.projectId) ids.add(decoded.projectId);
      else sawUntagged = true;
      if (decoded.scope === 'project') {
        const bucketId = decoded.projectId || legacyDefaultProjectId;
        if (!projectScopeEntriesById.has(bucketId)) projectScopeEntriesById.set(bucketId, []);
        projectScopeEntriesById.get(bucketId).push(decoded.entry);
      }
      }
    }
    // Backward compatibility (tracker f6b39bf0): a project already
    // evidenced by real timeline entries counts as existing regardless of
    // whether a dev.wigwag.project state event names it -- every room
    // using wigwag before this event type existed has projects with no
    // such event at all, and requiring one retroactively would silently
    // orphan them; only NEW projects go through the moderator gate. The
    // one behavior that DOES change: a room with genuinely nothing (no
    // entries, no state event) now correctly reports zero projects --
    // the old unconditional "always at least the legacy default" force-
    // add is gone, since Room Scoped Widget Mode now has a real "no
    // projects yet" state.
    if (sawUntagged) ids.add(legacyDefaultProjectId);
    return [...ids].map(id => {
      const isDefault = id === legacyDefaultProjectId;
      const derivedName = core.deriveProjectName(projectScopeEntriesById.get(id) || []);
      return {
        id,
        label: derivedName || (isDefault ? legacyDefaultProjectName : ('Project ' + id.slice(-8))),
        isDefault
      };
    });
  }

  // Seeds the exact localStorage shapes wigwag.html itself would create
  // for a brand-new local project (tests/helpers.js's own gotoTracker
  // seeds structurally the same shapes, for the same reason: hand a
  // fresh wigwag instance a specific starting doc rather than its own
  // default blank-project flow). Only runs the parts that are missing --
  // reconnecting to an already-set-up room must never clobber an
  // existing local identity or project list.
  //
  // Room-vs-identity: the derived project (the room) isn't "owned" by any
  // identity in a meaningful sense -- PROJECTS_KEY.milestones[].identityId
  // is per-browser bookkeeping only ("who I last wrote as here"), the same
  // derived-not-assigned relationship a non-Matrix project already has
  // (see requireAttribution's own comment in wigwag.html). Widget mode has
  // no switcher exposing multiple identities anyway, so this is invisible
  // in practice -- documented here so nothing later assumes a real
  // ownership relationship exists.
  // Identity is no longer this function's job (tracker f6b39bf0/#153): a
  // signing keypair is a device credential, not room content, so it lives
  // in the IFRAME's own real, unshimmed localStorage now -- this page has
  // no access to it at all (its own `localStorage` above never sees
  // IDENTITIES_KEY, since wigwag.html's isRoomModeContentKey deliberately
  // excludes it). MXID resolution still happens here (matrixUserId is
  // needed to hand to the iframe so IT can do the find-or-create, in
  // wigwag.html's own resolveRoomModeIdentity) -- see wigwag:hello-ack
  // below, where matrixUserId/fallbackDisplayName travel over.
  async function bootstrapLocalStorage(projectId, projectName, initialDoc, transport, fallbackUserId, fallbackDisplayName) {
    const matrixUserId = await transport.whoAmI(fallbackUserId);
    if (!matrixUserId) return { status: 'no-identity', message: 'Could not determine this session\'s Matrix user id.' };

    let projects = JSON.parse(localStorage.getItem(core.PROJECTS_KEY) || 'null');
    if (!projects || !Array.isArray(projects.milestones)) projects = { activeMilestoneId: null, milestones: [] };
    if (!projects.milestones.some(m => m.id === projectId)) {
      // identityId is corrected client-side once wigwag.html resolves the
      // real identity for this MXID (persistProjectIndex's own self-
      // correction) -- this page can't know that id any more.
      projects.milestones.push({ id: projectId, name: projectName, identityId: null });
    }
    projects.activeMilestoneId = projectId;
    localStorage.setItem(core.PROJECTS_KEY, JSON.stringify(projects));

    if (!localStorage.getItem(docKey(projectId))) {
      localStorage.setItem(docKey(projectId), JSON.stringify(initialDoc));
    }
    return { status: 'ok', matrixUserId };
  }

  function createMatrixBridge(transport, roomId, fallbackUserId, fallbackDisplayName) {
    let remoteRawEvents = [];
    const knownEntryIds = new Set(); // entries already sent to, or received from, Matrix -- never re-sent either way
    // Tracker #149: generalized from a single projectId to a discovered
    // SET -- widget mode has no local-only/private project concept (the
    // room IS the container, unlike Tauri/browser mode where identity is
    // the container and "Shared with you" is a real holding state). Every
    // project this browser ever comes to hold locally while connected
    // gets bridged, not just the one originally opened.
    const bridgedProjects = new Map(); // id -> { name, includeUntagged }
    // Resolved once in openAll() (via bootstrapLocalStorage's whoAmI call)
    // and handed to the iframe in wigwag:hello-ack so IT can do the
    // MXID-keyed find-or-create against its own real, unshimmed
    // IDENTITIES_KEY -- this page has no identity of its own to track any
    // more.
    let resolvedMatrixUserId = null;
    let resolvedDisplayName = null;
    let bridgeTimer = null;

    function reconcileIntoLocal(projectId) {
      const { name: projectName, includeUntagged } = bridgedProjects.get(projectId);
      // includeUntagged is true only for the room's one legacy/default
      // project -- untagged (pre-projectId) entries only ever belong to
      // that one, so a second, genuinely different project can never
      // silently absorb them.
      const remoteDoc = core.hydrateProjectFromMatrixTimeline(remoteRawEvents, { fieldDefs: core.defaultFieldDefs(), projectId, projectName, includeUntaggedEntries: includeUntagged });
      for (const item of flattenEntries(remoteDoc)) knownEntryIds.add(item.entry.id);

      const current = readCurrentLocalDoc(projectId);
      const fieldMerge = core.computeFieldDefsMerge(current.projectHistory, remoteDoc.fields, remoteDoc.projectHistory)
        || { mergedProjectHistory: current.projectHistory, mergedFieldDefs: current.fieldDefs };
      const issueMerge = core.computeIssueMerge(current.issues, remoteDoc.issues, fieldMerge.mergedFieldDefs, {});
      const mergedHydrated = {
        fieldDefs: fieldMerge.mergedFieldDefs, projectHistory: fieldMerge.mergedProjectHistory,
        issues: issueMerge.mergedIssues
      };
      localStorage.setItem(docKey(projectId), JSON.stringify(docStorable(mergedHydrated, current.hiddenFieldIds)));
    }

    // Creating one issue writes to localStorage more than once in quick
    // succession (a "Created" entry, then a "Title set" entry, ...) --
    // each write fires its own storage event. Without this guard, two
    // overlapping calls for the SAME project could each compute their own
    // toSend list from the same stale knownEntryIds snapshot before
    // either finishes adding to it, and both send the same entry. Only
    // one pass per project ever runs at a time; a call that arrives
    // mid-pass just asks for one more pass (re-reading local state fresh)
    // once the current one finishes, rather than starting a second
    // overlapping one. Different projects push fully independently.
    const pushInFlight = new Set();
    const pushAgainRequested = new Set();
    async function pushNewLocalEntries(projectId) {
      if (pushInFlight.has(projectId)) { pushAgainRequested.add(projectId); return; }
      pushInFlight.add(projectId);
      try {
        do {
          pushAgainRequested.delete(projectId);
          const current = readCurrentLocalDoc(projectId);
          const toSend = flattenEntries(current).filter(item => !knownEntryIds.has(item.entry.id));
          for (const item of toSend) {
            knownEntryIds.add(item.entry.id); // mark before sending -- a resend on failure is a harmless duplicate (deduped by entry id on read), a missed send from a race is not
            const content = core.matrixEventContentFromEntry({ ...item, projectId });
            const result = await transport.send(content);
            if (result.status !== 'ok') { console.warn('[wigwag-matrix-host] failed to send entry', item.entry.id, result); knownEntryIds.delete(item.entry.id); }
          }
        } while (pushAgainRequested.has(projectId));
      } finally {
        pushInFlight.delete(projectId);
      }
    }

    // Room snapshot write side (tracker f6b39bf0/#153, f1c7098f/#154) --
    // see WIGWAG_MATRIX_SNAPSHOT_TYPE's own comment in wigwag-core.js for
    // the read side and full rationale. Repackages a project's FULL
    // current history (not squashed -- every entry keeps its own real
    // signature) into one client-side-encrypted media blob, reusing the
    // exact per-entry shape flattenEntries/matrixEventContentFromEntry
    // already produce for ordinary batch pushes.
    //
    // This is ALSO the one-time bulk-adopt push for a project just adopted
    // into the room (tracker #149's original bulk-push, formerly its own
    // separate pushAllEntriesAsBatch, now folded in here). Live-reported
    // (Tom, tracker f6b39bf0): sending the full history as plain batch
    // entries AND THEN a snapshot -- what this file used to do -- means
    // every bulk-adopted entry goes out on the wire TWICE, roughly
    // doubling the request volume at exactly the moment (a big import)
    // rate limiting is already most likely to bite. A snapshot alone is a
    // complete, sufficient representation on its own; there is nothing the
    // separate batch send was accomplishing that the snapshot doesn't
    // already cover, for a fresh adopt.
    const lastSnapshotEntryCount = new Map(); // projectId -> entry count as of its last snapshot
    const SNAPSHOT_ENTRY_THRESHOLD = 200; // same order of magnitude as the pagination page size this is meant to bound
    async function pushSnapshotForProject(projectId) {
      const current = readCurrentLocalDoc(projectId);
      const items = flattenEntries(current).map(item => ({ ...item, projectId }));
      if (!items.length) return;
      // Marked before sending, same reasoning as pushNewLocalEntries: a
      // snapshot always includes EVERY entry regardless of knownEntryIds
      // (it must be complete and self-sufficient on its own, unlike an
      // incremental push) -- marking here just prevents a later
      // pushNewLocalEntries/reconcile pass from treating these as
      // still-unsent and pushing them again separately.
      items.forEach(item => knownEntryIds.add(item.entry.id));
      const cutoffSortKey = items.reduce((max, item) => Math.max(max, item.entry.sortKey || 0), 0);
      const snapshotId = crypto.randomUUID ? crypto.randomUUID() : ('snap-' + Date.now() + '-' + Math.random().toString(36).slice(2));
      const plaintextBytes = new TextEncoder().encode(JSON.stringify(items.map(item => core.matrixEventContentFromEntry(item))));
      const { ciphertext, encryption } = await core.encryptSnapshotPayload(plaintextBytes);
      const uploadResult = await transport.uploadSnapshotBlob(ciphertext);
      if (uploadResult.status !== 'ok') {
        console.warn('[wigwag-matrix-host] failed to upload snapshot blob for', projectId, uploadResult);
        items.forEach(item => knownEntryIds.delete(item.entry.id)); // roll back the optimistic mark -- these were never actually sent
        return;
      }
      const manifestContent = core.matrixEventContentFromSnapshotManifest({ projectId, snapshotId, cutoffSortKey, mxc: uploadResult.mxc, size: ciphertext.length, encryption });
      const manifestResult = await transport.sendSnapshotManifest(manifestContent);
      if (manifestResult.status === 'ok') {
        lastSnapshotEntryCount.set(projectId, items.length);
      } else {
        // The blob itself is already uploaded and orphaned at this point
        // (harmless -- nothing references it, and cleaning up superseded/
        // orphaned blobs is explicitly out of scope for now, same as the
        // old chunk-event design never cleaned up superseded snapshots
        // either). Rolling back knownEntryIds means a later retry starts
        // completely fresh (a new blob, a new manifest), not a half state.
        console.warn('[wigwag-matrix-host] failed to send snapshot manifest for', projectId, manifestResult);
        items.forEach(item => knownEntryIds.delete(item.entry.id));
      }
    }
    // Checked from the live poll's own reconcile step (below) -- a snapshot
    // taken here is purely a threshold-triggered convenience (bounding how
    // large the "replay everything" cost can grow for an active project
    // that was never bulk-imported); multiple viewers independently
    // crossing the threshold around the same time is wasteful but
    // harmless (idempotent, newest-wins on read).
    async function pushSnapshotIfDue(projectId) {
      const current = readCurrentLocalDoc(projectId);
      const entryCount = flattenEntries(current).length;
      const sinceLast = entryCount - (lastSnapshotEntryCount.get(projectId) || 0);
      if (sinceLast >= SNAPSHOT_ENTRY_THRESHOLD) await pushSnapshotForProject(projectId);
    }

    // Adopts any project this browser holds locally that isn't bridged
    // yet -- an import, "+ New project", or wigwag.html's own
    // delete-fallback (auto-creating a blank project when the last one is
    // deleted) all show up here the same way, and all belong to the room
    // unconditionally in this mode. Two things happen for each one found:
    // its identityId is normalized onto the room's own single
    // bootstrapped identity (wigwag.html's own PROJECTS_KEY storage
    // listener adopts the correction live -- closes the "stuck in Shared
    // with you, can't get back to the room's own scope" trap, since that
    // limbo state never had a reason to exist here), and its full existing
    // history is bulk-pushed to the room tagged with its own id, each
    // entry keeping its real original authorship (nothing is re-signed).
    //
    // No cross-room contamination guard needed here any more (unlike the
    // old shared-origin-localStorage design, tracker #149's original fix)
    // -- this page's own `localStorage` above is a private in-memory Map
    // that only ever exists for THIS bridge instance/room connection, so
    // there's no shared bucket a second room's widget could ever read.
    // identityId correction (a plain import lands with identityId: null,
    // wrong for a mode with no "Shared with you" concept) is now done
    // client-side, by wigwag.html's own persistProjectIndex -- this page
    // has no identity to correct it TO any more.
    function adoptLocalProjects() {
      let projects;
      try { projects = JSON.parse(localStorage.getItem(core.PROJECTS_KEY) || 'null'); } catch (e) { return; }
      if (!projects || !Array.isArray(projects.milestones)) return;
      for (const m of projects.milestones) {
        if (bridgedProjects.has(m.id)) continue;
        adoptOneLocalProject(m.id, m.name);
      }
    }
    // Moderator-gated (tracker f6b39bf0, live-reported rate-limit
    // incident, Tom's explicit call): creating the room's index entry for
    // this project MUST succeed before anything else about it is treated
    // as real. On rejection (a non-moderator), the optimistically-created
    // local project is rolled back (removed from PROJECTS_KEY, which
    // notifies the iframe via the existing wigwag:storage-changed
    // mechanism, same as any other local write) and a distinct
    // wigwag:room-write-rejected message carries a human-readable reason
    // -- never a silent console.warn. This is the second half of the
    // double-send incident's own lesson: a rejected/failed write must
    // never look like it succeeded.
    async function adoptOneLocalProject(projectId, projectName) {
      const createResult = await transport.createProject(projectId);
      if (createResult.status !== 'ok') {
        console.warn('[wigwag-matrix-host] project creation rejected for', projectId, createResult);
        try {
          const current = JSON.parse(localStorage.getItem(core.PROJECTS_KEY) || 'null');
          if (current && Array.isArray(current.milestones)) {
            current.milestones = current.milestones.filter(m => m.id !== projectId);
            localStorage.setItem(core.PROJECTS_KEY, JSON.stringify(current));
          }
        } catch (e) { /* best-effort rollback -- the rejection notice below still fires either way */ }
        localStorage.postMessageToFrame({
          type: 'wigwag:room-write-rejected',
          projectId,
          reason: createResult.status === 'forbidden'
            ? 'Only room moderators can add new projects to this room.'
            : ('Could not add this project to the room (' + createResult.status + (createResult.message ? ': ' + createResult.message : '') + ').')
        });
        return;
      }
      bridgedProjects.set(projectId, { name: projectName, includeUntagged: false });
      pushSnapshotForProject(projectId);
    }

    // Message-based equivalent of the old native `storage` event listener
    // -- the iframe no longer shares real localStorage with this page at
    // all, so instead of reacting to a native event, this reacts to the
    // iframe's own wigwag:local-write messages (see the `localStorage`
    // shim above for the wigwag:hello/wigwag:hello-ack side of the same
    // protocol).
    function onFrameMessage(e) {
      if (!e.data) return;
      if (e.data.type === 'wigwag:hello') {
        if (e.source) e.source.postMessage({
          type: 'wigwag:hello-ack',
          capabilities: { mode: 'room', multiIdentity: false, sharedProjectContext: true },
          snapshot: localStorage.dumpAll(),
          matrixUserId: resolvedMatrixUserId,
          fallbackDisplayName: resolvedDisplayName
        }, '*');
        return;
      }
      if (e.data.type !== 'wigwag:local-write') return;
      localStorage.applyFromFrame(e.data.key, e.data.newValue);
      if (e.data.key === core.PROJECTS_KEY) { adoptLocalProjects(); return; }
      for (const id of bridgedProjects.keys()) {
        if (e.data.key === docKey(id)) { pushNewLocalEntries(id); return; }
      }
    }

    // Split from a single start() into connect() + openProject() (tracker
    // #149): the room's own timeline has to actually be pulled before
    // it's possible to know how many projects it holds, and if there's
    // more than one, a human needs to pick which one before anything
    // gets bootstrapped/shown -- start() used to do all of that in one
    // uninterruptible pass, assuming exactly one project always existed.
    return {
      // Connects and discovers what's there -- does NOT bootstrap or show
      // anything yet. Caller decides what to do with the discovered list
      // (auto-open the only one, or show a picker).
      async connect() {
        const probe = await transport.probeAccess();
        if (probe.status !== 'can-read-write') return probe;

        // Project index (tracker f6b39bf0, live-reported rate-limit
        // incident) -- a real current-state read, reliable regardless of
        // room chattiness (see discoverProjects's own comment). Best-
        // effort: a transport error here must not block connecting
        // altogether -- discoverProjects's own timeline-scan/grandfather-
        // clause fallback still runs regardless below.
        let indexedProjectIds = [];
        const indexResult = await transport.getProjectIndex();
        if (indexResult.status === 'ok') indexedProjectIds = indexResult.projectIds;

        const initialPull = await transport.pullInitial();
        if (initialPull.status !== 'ok') return initialPull;

        const legacyDefaultProjectId = deriveProjectId(roomId);
        // Room snapshot integration (tracker f6b39bf0/#153, f1c7098f/#154)
        // -- see WIGWAG_MATRIX_SNAPSHOT_TYPE's own comment in
        // wigwag-core.js. A resolved snapshot for a project REPLACES that
        // project's older raw entries entirely (both represent the exact
        // same signed history -- keeping both would double-count every
        // pre-cutoff entry). Snapshot items are re-wrapped as synthetic
        // dev.wigwag.entry-shaped events so discoverProjects/
        // hydrateProjectFromMatrixTimeline need ZERO changes -- they can't
        // tell a snapshot-sourced entry from a directly-pulled one, by
        // design. A project with no (resolvable) snapshot behaves exactly
        // as before -- this is strictly additive, never a regression from
        // not having one yet. Resolving is async now (a real
        // download+decrypt per project), unlike the old chunk-reassembly
        // which came for free from the already-pulled raw events -- worth
        // its cost, since it also means there's no partial/incomplete
        // state to reason about any more: a snapshot either fully resolves
        // or it doesn't (see resolveSnapshotPayload's own comment).
        const manifestsByProject = core.findLatestSnapshotManifests(initialPull.events);
        const snapshotsByProject = new Map(); // projectId -> {cutoffSortKey, items}
        for (const [projectId, manifest] of manifestsByProject) {
          const resolved = await core.resolveSnapshotPayload(manifest, { downloadFn: transport.downloadSnapshotBlob });
          if (resolved) snapshotsByProject.set(projectId, { cutoffSortKey: manifest.cutoffSortKey, items: resolved.items });
        }
        const tailItems = core.decodeAllMatrixEntryItems(initialPull.events).filter(item => {
          const pid = item.projectId || legacyDefaultProjectId;
          const snap = snapshotsByProject.get(pid);
          return !snap || (item.entry.sortKey || 0) > snap.cutoffSortKey;
        });
        const snapshotItems = [].concat(...[...snapshotsByProject.values()].map(s => s.items));
        // dev.wigwag.project state events are carried through separately
        // (re-wrapping loses them, since matrixEventContentFromEntry has
        // no concept of them) -- discoverProjects's own timeline-scan
        // branch (the grandfather-clause/live-discovery path) needs them
        // present in remoteRawEvents in their real shape, not decoded as
        // an entry.
        const projectStateEvents = initialPull.events.filter(ev => ev && ev.type === core.WIGWAG_MATRIX_PROJECT_STATE_TYPE);
        remoteRawEvents = snapshotItems.concat(tailItems).map(item => ({ type: core.WIGWAG_MATRIX_ENTRY_TYPE, content: core.matrixEventContentFromEntry(item) })).concat(projectStateEvents);
        for (const [projectId, snap] of snapshotsByProject) lastSnapshotEntryCount.set(projectId, snap.items.length);

        const legacyDefaultProjectName = (await transport.getRoomName()) || ('Matrix room ' + roomId);
        const projects = discoverProjects(remoteRawEvents, legacyDefaultProjectId, legacyDefaultProjectName, indexedProjectIds);

        return { status: 'ok', projects, legacyDefaultProjectId };
      },
      // Bootstraps and reconciles EVERY project connect() discovered --
      // tracker #149, live-reported: the room's own data already tells you
      // every project that exists, so there's no reason to make a human
      // pick just one before anything is usable. All of them become
      // immediately available through wigwag.html's own normal switcher
      // (left fully live -- identity chrome is hidden by wigwag.html
      // itself now, driven by wigwag:hello-ack's capabilities);
      // defaultProjectId
      // picks which one is actually shown first (today: the room's own
      // legacy/default project, always present in connect()'s discovered
      // list; a future refinement could remember per-viewer "last looked
      // at" instead, the same way wigwag.html's own
      // lastActiveProjectByIdentity already does for identity switches).
      async openAll(projects, defaultProjectId) {
        // Resolved unconditionally, regardless of whether any project
        // exists yet (tracker f6b39bf0: a genuinely empty room -- no
        // projects, nothing to bootstrap -- still needs to tell wigwag.html
        // WHO is connected, so its own empty-state UI can render something
        // other than an unknown identity). The per-project loop below used
        // to be the only place this got set, via bootstrapLocalStorage's
        // own whoAmI call -- that loop simply never running for an empty
        // room left it permanently null otherwise. Checked here, upfront,
        // rather than only inside bootstrapLocalStorage's own per-project
        // check (still present, still fires for the non-empty case) --
        // that check simply never ran at all when projects=[], which
        // would have silently let a whoAmI failure through to a real
        // connect (fails-loudly was the original, pre-existing intent for
        // this failure -- never a placeholder identity).
        resolvedMatrixUserId = await transport.whoAmI(fallbackUserId);
        if (!resolvedMatrixUserId) return { status: 'no-identity', message: 'Could not determine this session\'s Matrix user id.' };
        resolvedDisplayName = fallbackDisplayName;
        for (const p of projects) {
          const isDefault = p.id === deriveProjectId(roomId);
          bridgedProjects.set(p.id, { name: p.label, includeUntagged: isDefault });

          const remoteDoc = core.hydrateProjectFromMatrixTimeline(remoteRawEvents, { fieldDefs: core.defaultFieldDefs(), projectId: p.id, projectName: p.label, includeUntaggedEntries: isDefault });
          for (const item of flattenEntries(remoteDoc)) knownEntryIds.add(item.entry.id);
          const bootstrapResult = await bootstrapLocalStorage(p.id, p.label, docStorable({ fieldDefs: remoteDoc.fields, projectHistory: remoteDoc.projectHistory, issues: remoteDoc.issues }, []), transport, fallbackUserId, fallbackDisplayName);
          if (bootstrapResult.status !== 'ok') return bootstrapResult;
          // A pre-existing local project at this same derived id may already
          // have entries the initial remote pull doesn't yet know about
          // (e.g. an earlier session's local edits that never made it out) --
          // reconcile once, immediately, before wiring up the live bridge.
          reconcileIntoLocal(p.id);
        }
        // bootstrapLocalStorage sets activeMilestoneId on every call --
        // after bootstrapping the whole discovered set, pin it back to the
        // one actually meant to be shown. A genuinely empty room (projects
        // = [], defaultProjectId still the derived legacy id even though
        // nothing bootstrapped it) leaves PROJECTS_KEY unset entirely --
        // nothing to pin, and wigwag.html's own empty-state handles it.
        try {
          const store = JSON.parse(localStorage.getItem(core.PROJECTS_KEY) || 'null');
          if (store) { store.activeMilestoneId = defaultProjectId; localStorage.setItem(core.PROJECTS_KEY, JSON.stringify(store)); }
        } catch (e) { /* non-fatal -- wigwag.html's own switcher still works, just may default to the wrong tab */ }
        // Any OTHER project already sitting in this browser's local
        // project list, from BEFORE this connection and not among the
        // room's own discovered set (a previous, disconnected import; a
        // stray leftover), gets adopted too, right from the start.
        adoptLocalProjects();

        window.addEventListener('message', onFrameMessage);
        bridgeTimer = setInterval(async () => {
          const result = await transport.pullMore();
          if (result.status === 'ok' && result.events.length) {
            remoteRawEvents = remoteRawEvents.concat(result.events);
            for (const id of bridgedProjects.keys()) reconcileIntoLocal(id);
            // Live-reported (Tom, tracker f6b39bf0): a project that first
            // appears in the room AFTER this viewer already connected
            // (someone else's import, mid-session) was invisible here
            // until a full reconnect -- the loop above only ever
            // reconciles projects it ALREADY knows about. "Everyone who
            // can see the widget in the room sees the same state" (the
            // whole point of Room Scoped Widget Mode) requires
            // discovering genuinely new ones too, not just refreshing
            // known ones. Mirrors openAll's own per-project bootstrap,
            // just triggered reactively instead of once at connect.
            const legacyDefaultProjectId = deriveProjectId(roomId);
            const discovered = discoverProjects(remoteRawEvents, legacyDefaultProjectId, '');
            for (const p of discovered) {
              if (bridgedProjects.has(p.id)) continue;
              const isDefault = p.id === legacyDefaultProjectId;
              bridgedProjects.set(p.id, { name: p.label, includeUntagged: isDefault });
              const remoteDoc = core.hydrateProjectFromMatrixTimeline(remoteRawEvents, { fieldDefs: core.defaultFieldDefs(), projectId: p.id, projectName: p.label, includeUntaggedEntries: isDefault });
              for (const item of flattenEntries(remoteDoc)) knownEntryIds.add(item.entry.id);
              await bootstrapLocalStorage(p.id, p.label, docStorable({ fieldDefs: remoteDoc.fields, projectHistory: remoteDoc.projectHistory, issues: remoteDoc.issues }, []), transport, fallbackUserId, fallbackDisplayName);
              reconcileIntoLocal(p.id);
            }
            for (const id of bridgedProjects.keys()) await pushSnapshotIfDue(id);
          }
        }, 5000);

        return { status: 'ok', projectId: defaultProjectId };
      },
      stop() {
        window.removeEventListener('message', onFrameMessage);
        if (bridgeTimer) clearInterval(bridgeTimer);
      }
    };
  }

  // A room bridged here is one shared "project holder" (tracker #149,
  // live-reported): switching or creating PROJECTS must stay fully live
  // (that's the whole point of the picker/discovery work above) -- what
  // shouldn't be visible or switchable in a widget is the IDENTITY concept
  // itself. wigwag.html's own identity system (multiple named identities,
  // each with its own signing key, switchable/creatable from the same
  // switcher menu) exists for its normal multi-identity desktop use; a
  // room-backed viewer already has exactly one identity, auto-bootstrapped
  // and keyed to their own Matrix user id (see bootstrapLocalStorage
  // above) -- there is nothing useful to switch TO, and exposing the UI
  // for it (add identity, per-identity settings) only invites exactly the
  // confusion Tom reported. wigwag.html is iframed completely unmodified,
  // so this is done from out here with injected CSS once the iframe
  // loads, rather than teaching wigwag.html anything about being embedded:
  // the switcher's left column (the identity/"scope" list -- scope rows,
  // the settings cog on each, "Add identity...") has no testid of its own,
  // so it's targeted structurally as switcher-menu's first child (see the
  // markup: two un-testid'd wrapper divs are switcher-menu's only two
  // top-level children, left = identity list, right = project list); the
  // header's identity breadcrumb (identity-title-prefix) and the "/"
  // separator right after it go the same way. The project list (right
  // column) and everything else in the switcher is untouched.
  //
  // NOTE: an earlier version of this also hid "Delete project", to guard
  // against wigwag.html's own "never leave zero projects" fallback
  // (deleting the last project auto-creates a disconnected local one --
  // the actual cause of a live two-different-"Untitled Project 1"s
  // incident). Reverted on Tom's explicit call: deleting must stay
  // available. That fallback behavior is still a real gap for the
  // room-bridged case -- not solved here, deliberately left alone rather
  // than guessed at again.
  //
  // hideIdentityChrome (the CSS-injection version of the above) is gone --
  // wigwag.html now hides this itself, driven by the real
  // `sharedProjectContext`/`multiIdentity` capabilities handed over in
