  // wigwag:hello-ack, instead of being puppeted from out here after the
  // fact. See wigwag.html's own switcher rendering.
  function showFrame() {
    $('setup').style.display = 'none';
    const frame = $('frame');
    frame.style.display = 'block';
    localStorage.attachFrame(frame);
    frame.src = 'wigwag.html';
  }

  // Shared by both transports once connect() has succeeded: bootstraps
  // and bridges EVERY discovered project (tracker #149, live-reported --
  // no "which project should everybody see?" prompt; the room's own data
  // already tells you what's there, and wigwag.html's own switcher is the
  // real way to move between them once shown). Shows the room's own
  // legacy/default project first.
  async function proceedAfterConnect(bridge, connectResult, onOpenFail) {
    setStatus('Opening…');
    const projects = connectResult.projects;
    // legacyDefaultProjectId isn't always one of the discovered projects
    // (a room holding only explicitly-tagged projects, no legacy/untagged
    // content at all, never adds it -- see discoverProjects) -- fall back
    // to whichever project actually exists.
    const defaultProjectId = projects.some(p => p.id === connectResult.legacyDefaultProjectId)
      ? connectResult.legacyDefaultProjectId
      : (projects[0] ? projects[0].id : connectResult.legacyDefaultProjectId);
    const openResult = await bridge.openAll(projects, defaultProjectId);
    if (openResult.status === 'ok') { showFrame(); return; }
    onOpenFail(openResult);
  }

  // ----- Entry point ------------------------------------------------------

  const widgetContext = getWidgetContext();
  if (widgetContext) {
    // No form, no user input at all: the room, the viewer, and access are
    // all already implied by being embedded. Per Tom's own call, a
    // widget-embedded instance is locked to this one room -- there's
    // nothing to pick, so no Connect Remote / switcher entry points are
    // shown either (there's simply no UI for them here to begin with).
    document.body.classList.add('widget-mode');
    setStatus('Connecting…');
    if (!widgetContext.roomId) {
      setStatus('This widget was not registered with a $matrix_room_id in its URL -- cannot tell which room to use.', 'error');
    } else {
      const transport = createWidgetTransport(widgetContext);
      const bridge = createMatrixBridge(transport, widgetContext.roomId, widgetContext.userId, widgetContext.displayName);
      bridge.connect().then(async (connectResult) => {
        if (connectResult.status !== 'ok') {
          // Every widget-mode failure this early is plausibly the same root
          // cause: Element gates each requested capability (read/send
          // dev.wigwag.entry) behind its own user-facing approval prompt,
          // shown once when the widget first loads -- a dismissed or
          // never-shown prompt looks like an ordinary protocol error
          // ("Cannot read room events of this type") with nothing in this
          // file able to distinguish it from a real one. Surfacing the hint
          // unconditionally is cheap and, worst case, irrelevant noise.
          setStatus('Could not connect (' + connectResult.status + (connectResult.message ? ': ' + connectResult.message : '') + ').\n\nIf this is the first time this widget has loaded in this room, check that Element\'s widget-permissions prompt was approved -- try removing and re-adding the widget if you\'re not sure one appeared.', 'error');
          return;
        }
        await proceedAfterConnect(bridge, connectResult, (openResult) => {
          setStatus('Could not open project (' + openResult.status + (openResult.message ? ': ' + openResult.message : '') + ').', 'error');
        });
      }).catch((e) => setStatus('Unexpected error: ' + e.message, 'error'));
    }
  } else {
    connectBtn.addEventListener('click', async () => {
      const homeserverUrl = $('homeserverUrl').value.trim();
      let accessToken = $('accessToken').value.trim();
      let roomId = $('roomId').value.trim();
      if (!homeserverUrl || !accessToken || !roomId) { setStatus('All three fields are required.', 'error'); return; }

      connectBtn.disabled = true;
      setStatus('Connecting…');
      try {
        if (roomId.startsWith('#')) {
          const resolved = await core.resolveMatrixRoomAlias({ fetchImpl: fetch, homeserverUrl, accessToken, alias: roomId });
          if (resolved.status !== 'ok') { setStatus('Could not resolve room alias "' + roomId + '" (' + resolved.status + (resolved.message ? ': ' + resolved.message : '') + ').', 'error'); connectBtn.disabled = false; return; }
          roomId = resolved.roomId;
        }
        const transport = createDirectTransport({ homeserverUrl, accessToken, roomId });
        const bridge = createMatrixBridge(transport, roomId, null);
        const connectResult = await bridge.connect();
        if (connectResult.status !== 'ok') {
          const messages = {
            'no-access': 'This token\'s account is not joined to that room (or the room id is wrong).',
            error: 'Matrix error: ' + (connectResult.message || 'unknown')
          };
          setStatus(messages[connectResult.status] || ('Could not connect (' + connectResult.status + ').' + (connectResult.message ? ' ' + connectResult.message : '')), 'error');
          connectBtn.disabled = false;
          return;
        }
        setStatus('Connected.', 'ok');
        await proceedAfterConnect(bridge, connectResult, (openResult) => {
          setStatus('Could not open project (' + openResult.status + (openResult.message ? ': ' + openResult.message : '') + ').', 'error');
          connectBtn.disabled = false;
        });
      } catch (e) {
        setStatus('Unexpected error: ' + e.message, 'error');
        connectBtn.disabled = false;
      }
    });
  }
})();
</script>
</body>
</html>
