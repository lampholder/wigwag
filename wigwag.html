      window.Babel.transformScriptTags();

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

er-radius:11px; box-shadow:0 14px 38px oklch(0 0 0 / 0.17); z-index:80; overflow:hidden; text-align:left;\">\n              <div style=\"padding:14px 16px 13px; border-bottom:1px solid oklch(0.93 0.003 250); background: oklch(0.985 0.003 250);\">\n                <div style=\"display:flex; align-items:center; gap:11px;\">\n                  <span style=\"width:10px; height:10px; border-radius:50%; background:{{ ident.dot }}; flex-shrink:0; margin:0 2px;\"><\u002Fspan>\n                  <div style=\"min-width:0; flex:1;\">\n                    <div style=\"font-size:13.5px; font-weight:700; line-height:1.3; color: oklch(0.24 0.006 250);\">{{ ident.lozengeText }}<\u002Fdiv>\n                    <div style=\"font-size:11.5px; color: oklch(0.5 0.006 250); font-family:ui-monospace,monospace; margin-top:1px;\">{{ ident.email }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:auto 1fr; gap:5px 9px; margin-top:12px; font-size:11px; align-items:baseline;\">\n                  <span style=\"color: oklch(0.58 0.006 250);\">State repo<\u002Fspan>\n                  <span style=\"font-family:ui-monospace,monospace; color: oklch(0.34 0.006 250); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ ident.stateRepo }}<\u002Fspan>\n                  <span style=\"color: oklch(0.58 0.006 250);\">Projects<\u002Fspan>\n                  <span style=\"color: oklch(0.34 0.006 250);\">{{ ident.projectCountLabel }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:10px 0 6px;\">\n                <div style=\"font-size:9.5px; font-weight:700; letter-spacing:0.07em; color: oklch(0.6 0.006 250); padding:0 16px 8px;\">SWITCH IDENTITY<\u002Fdiv>\n                <sc-for list=\"{{ ident.options }}\" as=\"o\" hint-placeholder-count=\"2\">\n                  <div data-testid=\"identity-option\" sc-camel-on-click=\"{{ o.onSelect }}\" style=\"display:flex; align-items:center; gap:11px; padding:8px 16px; cursor:pointer;\" style-hover=\"background: oklch(0.965 0.003 250);\">\n                    <span style=\"width:9px; height:9px; border-radius:50%; background:{{ o.dot }}; flex-shrink:0; margin:0 2px;\"><\u002Fspan>\n                    <div style=\"min-width:0; flex:1;\">\n                      <div style=\"font-size:12.5px; font-weight:{{ o.weight }}; line-height:1.3; color: oklch(0.26 0.006 250);\">{{ o.name }}<\u002Fdiv>\n                      <div style=\"font-size:10.5px; color: oklch(0.57 0.006 250); font-family:ui-monospace,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px;\">{{ o.stateRepo }} · {{ o.projectCountLabel }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ o.isActive }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color: oklch(0.5 0.13 235); font-size:12px; flex-shrink:0;\">✓<\u002Fspan><\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"border-top:1px solid oklch(0.93 0.003 250); padding:9px 16px; font-size:10.5px; color: oklch(0.55 0.006 250); line-height:1.5; background: oklch(0.988 0.003 250);\">Switching reloads the project list and everything you write is attributed to that address.<\u002Fdiv>\n              <div data-testid=\"btn-open-settings\" sc-camel-on-click=\"{{ ident.onOpenSettings }}\" style=\"padding:10px 16px; font-size:12.5px; cursor:pointer; color: oklch(0.26 0.006 250); font-weight:500; border-top:1px solid oklch(0.93 0.003 250);\" style-hover=\"background: oklch(0.97 0.003 250);\">Settings…<\u002Fdiv>\n              <div data-testid=\"btn-manage-identities\" sc-camel-on-click=\"{{ ident.onManage }}\" style=\"border-top:1px solid oklch(0.92 0.003 250); padding:10px 16px; font-size:12.5px; cursor:pointer; color: oklch(0.5 0.13 235); font-weight:600;\" style-hover=\"background: oklch(0.97 0.003 250);\">Manage identities…<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ settingsOpen }}\">\n            <div style=\"position:absolute; top:calc(100% + 7px); right:0; background:#fff; border:1px solid oklch(0.88 0.003 250); border-radius:8px; box-shadow:0 8px 24px oklch(0 0 0 / 0.12); width:280px; padding:14px; z-index:60;\">\n              <div style=\"font-size:11px; font-weight:600; letter-spacing:0.04em; color: oklch(0.5 0.006 250); margin-bottom:6px;\">LABEL<\u002Fdiv>\n              <input data-testid=\"settings-identity-label\" placeholder=\"Personal\" value=\"{{ settingsIdentityLabel }}\" sc-camel-on-change=\"{{ onSettingsIdentityLabelChange }}\" style=\"width:100%; box-sizing:border-box; padding:6px 8px; border:1px solid oklch(0.88 0.003 250); border-radius:6px; font-size:13px; font-family:inherit; margin-bottom:4px;\">\n              <div style=\"font-size:10.5px; color: oklch(0.6 0.006 250); margin-bottom:14px; line-height:1.4;\">How this identity is namespaced in the title and identity switcher (e.g. \"Personal / Delivery tracker\"). Doesn't affect the name shown on your comments -- that always comes from your email.<\u002Fdiv>\n              <div style=\"font-size:11px; font-weight:600; letter-spacing:0.04em; color: oklch(0.5 0.006 250); margin-bottom:6px;\">YOUR EMAIL<\u002Fdiv>\n              <input data-testid=\"settings-identity-email\" placeholder=\"you@example.com\" value=\"{{ identityEmail }}\" sc-camel-on-change=\"{{ onIdentityEmailChange }}\" style=\"width:100%; box-sizing:border-box; padding:6px 8px; border:1px solid oklch(0.88 0.003 250); border-radius:6px; font-size:13px; font-family:inherit; margin-bottom:4px;\">\n              <div style=\"font-size:10.5px; color: oklch(0.6 0.006 250); margin-bottom:14px; line-height:1.4;\">Attached to every change you make and signed with a key generated in this browser, so collaborators can see it's really from you across syncs. Self-proclaimed, not verified by anyone — a lightweight \"who did this\" marker for sharing between collaborators, not a security boundary.<\u002Fdiv>\n              <div style=\"font-size:11px; font-weight:600; letter-spacing:0.04em; color: oklch(0.5 0.006 250); margin-bottom:6px;\">GITHUB TOKEN<\u002Fdiv>\n              <input data-testid=\"settings-github-token\" type=\"password\" placeholder=\"ghp_… (repo access)\" value=\"{{ githubToken }}\" sc-camel-on-change=\"{{ onGithubTokenChange }}\" style=\"width:100%; box-sizing:border-box; padding:6px 8px; border:1px solid oklch(0.88 0.003 250); border-radius:6px; font-size:13px; font-family:inherit; margin-bottom:4px;\">\n              <div style=\"font-size:10.5px; color: oklch(0.6 0.006 250); line-height:1.4;\">Needed for private repos, and for pushing/pulling this tracker's own data if you connect a GitHub repo below (read-only is fine if you're only linking issues; repo sync needs write access — \"Contents: Read and write\" on a fine-grained token, or classic \"repo\" scope). Stored only in this browser's localStorage — never exported, never in \"View source\".<\u002Fdiv>\n              <input data-testid=\"settings-github-oauth-client-id\" placeholder=\"OAuth Client ID (Iv1....)\" value=\"{{ githubOAuthClientId }}\" sc-camel-on-change=\"{{ onGithubOAuthClientIdChange }}\" style=\"width:100%; box-sizing:border-box; padding:6px 8px; border:1px solid oklch(0.88 0.003 250); border-radius:6px; font-size:13px; font-family:inherit; margin-top:8px; margin-bottom:4px;\">\n              <input data-testid=\"settings-github-oauth-proxy-url\" placeholder=\"http://localhost:8935\" value=\"{{ githubOAuthProxyUrl }}\" sc-camel-on-change=\"{{ onGithubOAuthProxyUrlChange }}\" style=\"width:100%; box-sizing:border-box; padding:6px 8px; border:1px solid oklch(0.88 0.003 250); border-radius:6px; font-size:13px; font-family:inherit; margin-bottom:4px;\">\n              <button data-testid=\"btn-github-signin\" sc-camel-on-click=\"{{ onSignInWithGithub }}\" style=\"width:100%; box-sizing:border-box; padding:6px 8px; border:1px solid oklch(0.88 0.003 250); background:#fff; border-radius:6px; font-size:12.5px; font-weight:500; cursor:pointer; margin-bottom:4px;\" style-hover=\"background: oklch(0.97 0.003 250);\">Sign in with GitHub<\u002Fbutton>\n              <div style=\"font-size:10.5px; color: oklch(0.6 0.006 250); margin-bottom:14px; line-height:1.4;\">Only needed to use \"Sign in\" instead of pasting a token above — requires running <code>npm run github-oauth-proxy<\u002Fcode> locally with your own GitHub App credentials (see README). Opens a popup; the token it returns fills in GITHUB TOKEN above, nothing else is stored.<\u002Fdiv>\n              <div style=\"font-size:11px; font-weight:600; letter-spacing:0.04em; color: oklch(0.5 0.006 250); margin-bottom:6px;\">JIRA PROXY URL<\u002Fdiv>\n              <input data-testid=\"settings-jira-proxy-url\" placeholder=\"http://localhost:8934\" value=\"{{ jiraProxyUrl }}\" sc-camel-on-change=\"{{ onJiraProxyUrlChange }}\" style=\"width:100%; box-sizing:border-box; padding:6px 8px; border:1px solid oklch(0.88 0.003 250); border-radius:6px; font-size:13px; font-family:inherit; margin-bottom:4px;\">\n              <div style=\"font-size:10.5px; color: oklch(0.6 0.006 250); line-height:1.4;\">Run <code>npm run jira-proxy<\u002Fcode> locally to link Jira issues — see README. Credentials stay in that process, never in the browser.<\u002Fdiv>\n              <div style=\"font-size:11px; font-weight:600; letter-spacing:0.04em; color: oklch(0.5 0.006 250); margin-top:14px; margin-bottom:6px;\">STATE REPO<\u002Fdiv>\n              <input data-testid=\"settings-state-repo\" placeholder=\"owner/repo\" value=\"{{ settingsStateRepo }}\" sc-camel-on-change=\"{{ onSettingsStateRepoChange }}\" style=\"width:100%; box-sizing:border-box; padding:6px 8px; border:1px solid oklch(0.88 0.003 250); border-radius:6px; font-size:13px; font-family:inherit; margin-bottom:4px;\">\n              <div style=\"font-size:10.5px; color: oklch(0.6 0.006 250); line-height:1.4;\">Where this identity's own projects live. Shown on its card in Identities; not yet wired to any sync.<\u002Fdiv>\n              <div style=\"font-size:11px; font-weight:600; letter-spacing:0.04em; color: oklch(0.5 0.006 250); margin-top:14px; margin-bottom:6px;\">GITHUB REPO SYNC<\u002Fdiv>\n              <input data-testid=\"settings-github-repo\" placeholder=\"owner/repo\" value=\"{{ githubRepo }}\" sc-camel-on-change=\"{{ onGithubRepoChange }}\" style=\"width:100%; box-sizing:border-box; padding:6px 8px; border:1px solid oklch(0.88 0.003 250); border-radius:6px; font-size:13px; font-family:inherit; margin-bottom:4px;\">\n              <input data-testid=\"settings-github-repo-path\" placeholder=\"tracker.jsonl\" value=\"{{ githubRepoPath }}\" sc-camel-on-change=\"{{ onGithubRepoPathChange }}\" style=\"width:100%; box-sizing:border-box; padding:6px 8px; border:1px solid oklch(0.88 0.003 250); border-radius:6px; font-size:13px; font-family:inherit; margin-bottom:4px;\">\n              <input data-testid=\"settings-github-repo-branch\" placeholder=\"branch (blank = repo default)\" value=\"{{ githubRepoBranch }}\" sc-camel-on-change=\"{{ onGithubRepoBranchChange }}\" style=\"width:100%; box-sizing:border-box; padding:6px 8px; border:1px solid oklch(0.88 0.003 250); border-radius:6px; font-size:13px; font-family:inherit; margin-bottom:4px;\">\n              <div style=\"font-size:10.5px; color: oklch(0.6 0.006 250); line-height:1.4;\">Once set, this tracker's own data (not just linked issues) pushes/pulls here — the repo becomes the primary copy, with real commit history. Needs the token above with write access. Leave blank to keep working local-only; nothing here is required.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; align-items:center; justify-content:space-between; padding: 20px 28px; border-bottom: 1px solid oklch(0.9 0.003 250); background:#fff; box-sizing:border-box;\">\n    <div style=\"display:flex; align-items:center; gap:14px;\">\n      <div style=\"display:flex; align-items:baseline;\">\n      <span data-testid=\"identity-title-prefix\" style=\"font-size:20px; font-weight:400; letter-spacing:-0.01em; color: oklch(0.62 0.006 250); white-space:nowrap; flex-shrink:0; user-select:none;\">{{ ident.lozengeText }}<span style=\"color: oklch(0.8 0.004 250); font-weight:300; padding:0 10px;\">/<\u002Fspan><\u002Fspan>\n      <div data-testid=\"tracker-switcher-wrap\" style=\"position:relative;\">\n        <div style=\"display:inline-flex; border-radius:7px; overflow:hidden; font-size:0; margin-left:-8px;\" style-hover=\"background: oklch(0.95 0.004 250);\">\n          <span data-testid=\"tracker-name-title\" sc-camel-on-click=\"{{ onToggleNotes }}\" title=\"Open project details\" style=\"padding:6px 8px; border-radius:6px 0 0 6px; font-size:22px; font-weight:700; letter-spacing:-0.01em; cursor:pointer;\" style-hover=\"background: oklch(0.89 0.004 250);\">{{ trackerName }}<\u002Fspan>\n          <span data-testid=\"btn-tracker-switcher\" sc-camel-on-click=\"{{ onToggleTrackerSwitcher }}\" title=\"Switch project\" style=\"padding:0 10px; border-radius:0 6px 6px 0; display:flex; align-items:center; cursor:pointer;\" style-hover=\"background: oklch(0.89 0.004 250);\">\n            <span style=\"display:inline-block; width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent; border-top:7px solid oklch(0.5 0.006 250); pointer-events:none;\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ trackerSwitcherOpen }}\">\n          <div style=\"position:absolute; top:calc(100% + 2px); left:8px; background:#fff; border:1px solid oklch(0.88 0.003 250); border-radius:8px; box-shadow:0 8px 24px oklch(0 0 0 / 0.12); min-width:290px; z-index:60; overflow:hidden;\">\n            <sc-for list=\"{{ projectItems }}\" as=\"m\" hint-plac =\"email-gate-overlay\" style=\"position:fixed; inset:0; background: oklch(0 0 0 / 0.4); z-index:200; display:flex; align-items:center; justify-content:center;\">\n      <div data-testid=\"email-gate-modal\" style=\"background:#fff; border-radius:11px; box-shadow:0 14px 38px oklch(0 0 0 / 0.17); width:360px; max-width:92vw; padding:22px 24px; box-sizing:border-box;\">\n        <div style=\"font-size:15px; font-weight:700; margin-bottom:8px;\">Set your email to continue<\u002Fdiv>\n        <div style=\"font-size:12.5px; color: oklch(0.48 0.006 250); line-height:1.5; margin-bottom:16px;\">Attached to every change you make and signed with a key generated in this browser, so collaborators can see it's really from you. Self-proclaimed, not verified by anyone — not a security boundary.<\u002Fdiv>\n        <input data-testid=\"email-gate-input\" sc-camel-auto-focus=\"{{ true }}\" placeholder=\"you@example.com\" value=\"{{ emailGate.draft }}\" sc-camel-on-change=\"{{ emailGate.onDraftChange }}\" sc-camel-on-key-down=\"{{ emailGate.onKeyDown }}\" style=\"width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid oklch(0.88 0.003 250); border-radius:6px; font-size:13.5px; font-family:inherit; margin-bottom:16px;\">\n        <div style=\"display:flex; gap:8px; justify-content:flex-end;\">\n          <span data-testid=\"btn-cancel-email-gate\" sc-camel-on-click=\"{{ emailGate.onCancel }}\" style=\"cursor:pointer; font-size:12.5px; color: oklch(0.5 0.006 250); padding:7px 12px; border-radius:6px;\" style-hover=\"background:oklch(0.94 0.004 250);\">Cancel<\u002Fspan>\n          <button data-testid=\"btn-submit-email-gate\" sc-camel-on-click=\"{{ emailGate.onSubmit }}\" style=\"border:none; border-radius:6px; background: oklch(0.5 0.13 235); color:#fff; font-size:12.5px; font-weight:600; padding:7px 14px; cursor:pointer;\" style-hover=\"background: oklch(0.44 0.14 235);\">Continue<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ pasteImportOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-testid=\"paste-import-overlay\" style=\"position:fixed; inset:0; background: oklch(0 0 0 / 0.4); z-index:200; display:flex; align-items:center; justify-content:center;\">\n      <div data-testid=\"paste-import-modal\" style=\"background:#fff; border-radius:11px; box-shadow:0 14px 38px oklch(0 0 0 / 0.17); width:480px; max-width:92vw; padding:22px 24px; box-sizing:border-box;\">\n        <div style=\"font-size:15px; font-weight:700; margin-bottom:8px;\">Paste project data<\u002Fdiv>\n        <div style=\"font-size:12.5px; color: oklch(0.48 0.006 250); line-height:1.5; margin-bottom:12px;\">Paste JSONL exported from another copy of this tracker. Creates a new project — your current one is untouched.<\u002Fdiv>\n        <textarea data-testid=\"paste-import-textarea\" sc-camel-auto-focus=\"{{ true }}\" placeholder=\"Paste JSONL here…\" value=\"{{ pasteImportDraft }}\" sc-camel-on-change=\"{{ onPasteImportDraftChange }}\" style=\"width:100%; box-sizing:border-box; min-height:160px; padding:8px 10px; border:1px solid oklch(0.88 0.003 250); border-radius:6px; font-size:12px; font-family:ui-monospace,monospace; resize:vertical; margin-bottom:16px;\"><\u002Ftextarea>\n        <div style=\"display:flex; gap:8px; justify-content:flex-end;\">\n          <span data-testid=\"btn-cancel-paste-import\" sc-camel-on-click=\"{{ onCancelPasteImport }}\" style=\"cursor:pointer; font-size:12.5px; color: oklch(0.5 0.006 250); padding:7px 12px; border-radius:6px;\" style-hover=\"background:oklch(0.94 0.004 250);\">Cancel<\u002Fspan>\n          <button data-testid=\"btn-submit-paste-import\" sc-camel-on-click=\"{{ onSubmitPasteImport }}\" style=\"border:none; border-radius:6px; background: oklch(0.5 0.13 235); color:#fff; font-size:12.5px; font-weight:600; padding:7px 14px; cursor:pointer;\" style-hover=\"background: oklch(0.44 0.14 235);\">Import<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ pasteMergeOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-testid=\"paste-merge-overlay\" style=\"position:fixed; inset:0; background: oklch(0 0 0 / 0.4); z-index:200; display:flex; align-items:center; justify-content:center;\">\n      <div data-testid=\"paste-merge-modal\" style=\"background:#fff; border-radius:11px; box-shadow:0 14px 38px oklch(0 0 0 / 0.17); width:480px; max-width:92vw; padding:22px 24px; box-sizing:border-box;\">\n        <div style=\"font-size:15px; font-weight:700; margin-bottom:8px;\">Paste an update<\u002Fdiv>\n        <div style=\"font-size:12.5px; color: oklch(0.48 0.006 250); line-height:1.5; margin-bottom:12px;\">Paste JSONL from another copy of this project to merge it into your current one — same as \"Apply update…\" from a file.<\u002Fdiv>\n        <textarea data-testid=\"paste-merge-textarea\" sc-camel-auto-focus=\"{{ true }}\" placeholder=\"Paste JSONL here…\" value=\"{{ pasteMergeDraft }}\" sc-camel-on-change=\"{{ onPasteMergeDraftChange }}\" style=\"width:100%; box-sizing:border-box; min-height:160px; padding:8px 10px; border:1px solid oklch(0.88 0.003 250); border-radius:6px; font-size:12px; font-family:ui-monospace,monospace; resize:vertical; margin-bottom:16px;\"><\u002Ftextarea>\n        <div style=\"display:flex; gap:8px; justify-content:flex-end;\">\n          <span data-testid=\"btn-cancel-paste-merge\" sc-camel-on-click=\"{{ onCancelPasteMerge }}\" style=\"cursor:pointer; font-size:12.5px; color: oklch(0.5 0.006 250); padding:7px 12px; border-radius:6px;\" style-hover=\"background:oklch(0.94 0.004 250);\">Cancel<\u002Fspan>\n          <button data-testid=\"btn-submit-paste-merge\" sc-camel-on-click=\"{{ onSubmitPasteMerge }}\" style=\"border:none; border-radius:6px; background: oklch(0.5 0.13 235); color:#fff; font-size:12.5px; font-weight:600; padding:7px 14px; cursor:pointer;\" style-hover=\"background: oklch(0.44 0.14 235);\">Apply<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst COLORS = {\n  red: { bg: 'oklch(0.94 0.035 25)', fg: 'oklch(0.42 0.16 25)', dot: 'oklch(0.58 0.2 25)' },\n  amber: { bg: 'oklch(0.95 0.045 85)', fg: 'oklch(0.46 0.12 75)', dot: 'oklch(0.78 0.15 85)' },\n  green: { bg: 'oklch(0.94 0.05 150)', fg: 'oklch(0.42 0.11 150)', dot: 'oklch(0.6 0.15 150)' },\n  blue: { bg: 'oklch(0.94 0.03 235)', fg: 'oklch(0.42 0.13 235)', dot: 'oklch(0.5 0.13 235)' },\n  teal: { bg: 'oklch(0.94 0.035 195)', fg: 'oklch(0.42 0.11 195)', dot: 'oklch(0.55 0.11 195)' },\n  pink: { bg: 'oklch(0.94 0.035 350)', fg: 'oklch(0.45 0.14 350)', dot: 'oklch(0.58 0.16 350)' },\n  purple: { bg: 'oklch(0.94 0.04 300)', fg: 'oklch(0.44 0.14 300)', dot: 'oklch(0.56 0.14 300)' },\n  gray: { bg: 'oklch(0.95 0.004 250)', fg: 'oklch(0.42 0.006 250)', dot: 'oklch(0.65 0.006 250)' }\n};\nconst PALETTE_ORDER = ['red', 'amber', 'green', 'teal', 'blue', 'purple', 'pink', 'gray'];\nconst WIDTHS = { type: 150, priority: 118, linked: 190, rag: 150, teams: 200, mitigation: 190 };\nfunction defaultFieldDefs() {\n  return {\n    title: { label: 'Issue', type: 'text' },\n    linked: { label: 'Related', type: 'issue' },\n    type: { label: 'Type', type: 'select', linkedSourceId: 'title', rule: 'source.github && source.github.labels.includes(\"bug\") ? \"bug\" : \"enhancement\"', options: [\n      { id: 'bug', label: 'Bug', color: 'red', emoji: '' },\n      { id: 'enhancement', label: 'Enhancement', color: 'blue', emoji: '' },\n      { id: 'chore', label: 'Chore', color: 'gray', emoji: '' }\n    ] },\n    priority: { label: 'Priority', type: 'select', options: [\n      { id: 'p0', label: 'P0', color: 'red', emoji: '' },\n      { id: 'p1', label: 'P1', color: 'amber', emoji: '' },\n      { id: 'p2', label: 'P2', color: 'gray', emoji: '' }\n    ] },\n    rag: { label: 'RAG', type: 'select', options: [\n      { id: 'green', label: 'On track', color: 'green', emoji: '🟢' },\n      { id: 'amber', label: 'At risk', color: 'amber', emoji: '🟡' },\n      { id: 'red', label: 'Off track', color: 'red', emoji: '🔴' }\n    ] },\n    teams: { label: 'Delivery teams', type: 'multiselect', options: [\n      { id: 'platform', label: 'Platform', color: 'blue' }, { id: 'ops', label: 'Ops', color: 'teal' }, { id: 'mobile', label: 'Mobile', color: 'purple' },\n      { id: 'web', label: 'Web', color: 'pink' }, { id: 'infra', label: 'Infra', color: 'gray' }\n    ] },\n    mitigation: { label: 'Mitigation', type: 'text' }\n  };\n}\nfunction defaultColumnOrder() { return ['type', 'priority', 'linked', 'rag', 'teams', 'mitigation']; }\nfunction canonicalColumnOrder(fieldDefs, hiddenFieldIds) {\n  const visible = Object.keys(fieldDefs).filter(id => id !== 'title' && !hiddenFieldIds.includes(id));\n  const known = defaultColumnOrder().filter(id => visible.includes(id));\n  const rest = visible.filter(id => !known.includes(id));\n  return [...known, ...rest];\n}\nfunction reconcileColumnOrder(override, fieldDefs, hiddenFieldIds) {\n  const visible = Object.keys(fieldDefs).filter(id => id !== 'title' && !hiddenFieldIds.includes(id));\n  const fromOverride = (override || []).filter(id => visible.includes(id));\n  const missing = visible.filter(id => !fromOverride.includes(id));\n  if (!missing.length) return fromOverride;\n  const canonicalRest = canonicalColumnOrder(fieldDefs, hiddenFieldIds).filter(id => missing.includes(id));\n  return [...fromOverride, ...canonicalRest];\n}\nconst STORAGE_KEY = 'git_native_tracker_v1';\n// Secrets (GitHub token, Jira proxy URL) live under a deliberately separate\n// key — never read by persist()/loadPersisted() (the tracker's own,\n// exportable state) or buildSourceText() (export / \"View source\"), so a\n// token can never end up in a JSONL export or a git commit.\nconst SECRETS_KEY = 'git_native_tracker_secrets_v1';\nconst PROJECTS_KEY = 'git_native_tracker_milestones_v1';\nconst IDENTITIES_KEY = 'git_native_tracker_identities_v1';\n// Column widths: cosmetic-only, per-browser -- deliberately never read by\n// persist()/loadPersisted() or buildSourceText(), same reasoning as\n// SECRETS_KEY above. { [projectId]: { [colId]: px } }.\nconst COLUMN_WIDTHS_KEY = 'git_native_tracker_col_widths_v1';\n// Wrap-vs-truncate per text/issue-type column (including the title, under\n// the key 'title'): cosmetic-only, per-browser, per-project -- same\n// reasoning as COLUMN_WIDTHS_KEY above. { [projectId]: { [colId]: boolean } }.\nconst WRAP_KEY = 'git_native_tracker_wrap_v1';\n// Column order: cosmetic-only, per-browser, per-project -- same\n// reasoning as COLUMN_WIDTHS_KEY. { [projectId]: [colId, ...] }. Absent\n// (not just empty) means \"no override saved yet, use canonical order\" --\n// see reconcileColumnOrder().\nconst COLUMN_ORDER_KEY = 'git_native_tracker_col_order_v1';\n// Column value filters: cosmetic-only, per-browser, per-project -- same\n// reasoning again. { [projectId]: { [colId]: [optionId, ...] } }.\nconst COLUMN_FILTERS_KEY = 'git_native_tracker_col_filters_v1';\n// Sort (ascending/descending): cosmetic-only, per-browser, per-project --\n// same reasoning again. { [projectId]: { colId, dir } }.\nconst SORT_KEY = 'git_native_tracker_sort_v1';\n// GitHub-sync leadership: { [projectId]: { tabId, heartbeatAt, syncStatus, syncError, lastSyncedAt } }.\n// Only the leader actually connects/pushes; followers mirror its published\n// status so their own sync pill stays accurate instead of showing \"Not\n// connected\" while syncing is in fact happening, just from another tab.\nconst GITHUB_LEADER_KEY = 'git_native_tracker_sync_leader_v1';\n// Project ids already ingested from an embedded \"Export as HTML\" snapshot\n// -- an id only gets seeded-and-switched-to once, on the recipient's first\n// ever open of that particular exported file, never again on later opens.\nconst SNAPSHOT_INGESTED_KEY = 'git_native_tracker_snapshot_ingested_v1';\nconst GITHUB_LEADER_STALE_MS = window.__wigwagLeaderStaleMs || 15000;\n\nfunction truncate(s, n) { if (!s) return s; return s.length > n ? s.slice(0, n - 1) + '…' : s; }\nfunction formatNow() {\n  const d = new Date();\n  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });\n}\n\nconst JIRA_KEY_RE = /^[A-Z][A-Z0-9]+-\\d+$/i;\nfunction refInfo(text) {\n  if (!text) return null;\n  const t = text.trim();\n  if (/^https?:\\/\\//i.test(t)) return { href: t, label: truncate(t.replace(/^https?:\\/\\//i, ''), 40) };\n  const gh = t.match(/^([\\w.-]+\\/[\\w.-]+)#(\\d+)$/);\n  if (gh) return { href: 'https://github.com/' + gh[1] + '/issues/' + gh[2], label: t };\n  if (JIRA_KEY_RE.test(t)) return { href: null, label: t.toUpperCase() };\n  return null;\n}\nfunction col(name) { return COLORS[name] || COLORS.gray; }\nfunction pickGithubFields(obj) {\n  return {\n    key: obj.key || '', labels: obj.labels || [], description: obj.description || '', status: obj.status || '',\n    statusCategory: obj.statusCategory || '', issueType: obj.issueType || '', assignees: obj.assignees || [],\n    reporter: obj.reporter || '', created: obj.created || '', updated: obj.updated || '',\n    resolution: obj.resolution || '', resolutionDate: obj.resolutionDate || '', fixVersions: obj.fixVersions || [],\n    project: obj.project || ''\n  };\n}\nfunction pickJiraFields(obj) {\n  return {\n    key: obj.key || '', labels: obj.labels || [], description: obj.description || '', status: obj.status || '',\n    statusCategory: obj.statusCategory || '', issueType: obj.issueType || '', priority: obj.priority || '',\n    assignee: obj.assignee || '', reporter: obj.reporter || '', created: obj.created || '', updated: obj.updated || '',\n    dueDate: obj.dueDate || '', resolution: obj.resolution || '', resolutionDate: obj.resolutionDate || '',\n    components: obj.components || [], fixVersions: obj.fixVersions || [], project: obj.project || ''\n  };\n}\n// The template engine HTML-escapes every {{ }} interpolation (confirmed by\n// testing: typing \"<b>\" into a title renders as literal text, not a bold\n// element), so there is no way to hand it trusted HTML through a render\n// prop -- rendered comment HTML gets set via a plain DOM innerHTML pass\n// instead (see hydrateCommentMarkdown), keyed off a data-testid container\n// the template leaves empty. That pass is itself the XSS boundary:\n// escapeHtml() runs on the ENTIRE raw text before any markdown syntax is\n// interpreted, so every transformation below only ever wraps already-\n// escaped, inert text in a fixed set of known-safe tags -- it can never\n// introduce a live tag/attribute from what the comment author wrote. A\n// subset of GFM: **bold**, *italic*, ~~strike~~, `code`, fenced ``` code\n// blocks, [links](url) (http/https/mailto only), lists, blockquotes,\n// headings, paragraphs (single newline -> <br>, blank line -> new\n// paragraph). Deliberately NOT supported: raw HTML passthrough (security),\n// images, bare-URL autolinking, nested lists, reference-style links -- a\n// comment box does not need full CommonMark fidelity.\n//\n// Editing keeps the append-only shape of everything else this app\n// persists (mirrors how a field's history is a log of every set, never a\n// mutation): an edit appends a NEW entry to issues[].comments sharing the\n// ORIGINAL comment's id, with a fresh time/sortKey. Nothing already in the\n// array is ever changed or removed. latestCommentsById() derives what to\n// actually display -- one bubble per id, showing the latest entry's text\n// but the EARLIEST entry's time (so editing does not bump a comment's\n// position in the thread), flagging wasEdited when more than one entry\n// shares an id.\nfunction escapeHtml(s) {\n  return String(s == null ? '' : s)\n    .replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;')\n    .replace(/\"/
